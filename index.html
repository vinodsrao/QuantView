<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuantView - Stock, ETF & Crypto Charting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #price-chart-container {
      flex: 1;
      width: 100%;
      min-height: 250px;
    }

    #volume-chart-container {
      height: 128px;
      width: 100%;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #1e222d;
    }

    ::-webkit-scrollbar-thumb {
      background: #363c4e;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4f566b;
    }
  </style>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col select-none">

<!-- Header Navigation Bar -->
<header class="h-12 border-b border-[#2a2e39] bg-[#1e222d] flex items-center justify-between px-4 z-10 shrink-0">
  <div class="flex items-center space-x-4">
    <div class="flex items-center space-x-2 font-bold text-lg text-white">
      <span class="text-blue-500">❖</span>
      <span>QuantView</span>
    </div>
    <div class="h-4 w-[1px] bg-[#363c4e]"></div>

    <!-- Symbol Header & Selector -->
    <div class="flex items-center space-x-2">
      <span id="symbol-display" class="font-semibold text-white text-base">AAPL</span>
      <span id="data-source-badge"
            class="text-[10px] px-1.5 py-0.5 rounded bg-green-900/50 text-green-400 border border-green-700/50 font-mono">PROXY LIVE</span>
    </div>

    <!-- Timeframe Buttons -->
    <div class="flex items-center space-x-1 ml-4 bg-[#131722] p-0.5 rounded border border-[#2a2e39]">
      <button class="tf-btn px-2.5 py-1 text-xs rounded font-medium hover:bg-[#2a2e39] text-gray-400"
              data-tf="1d">1D</button>
      <button class="tf-btn px-2.5 py-1 text-xs rounded font-medium hover:bg-[#2a2e39] text-gray-400"
              data-tf="1w">1W</button>
      <button class="tf-btn px-2.5 py-1 text-xs rounded font-medium hover:bg-[#2a2e39] text-gray-400"
              data-tf="1M">1M</button>
      <button class="tf-btn px-2.5 py-1 text-xs rounded font-medium hover:bg-[#2a2e39] text-gray-400"
              data-tf="3M">3M</button>
    </div>
  </div>

  <!-- Live Candle Legend HUD -->
  <div id="ohlcv-hud" class="flex items-center space-x-3 text-xs font-mono">
    <span>O: <span id="hud-o" class="text-white">--</span></span>
    <span>H: <span id="hud-h" class="text-white">--</span></span>
    <span>L: <span id="hud-l" class="text-white">--</span></span>
    <span>C: <span id="hud-c" class="text-white">--</span></span>
    <span>V: <span id="hud-v" class="text-white">--</span></span>
    <span id="hud-signal"
          class="px-1.5 py-0.5 rounded text-[10px] font-sans font-bold bg-gray-800 text-gray-400">NEUTRAL</span>
  </div>
</header>

<!-- Main App Layout -->
<div class="flex-1 flex overflow-hidden">

  <!-- Chart Column -->
  <div class="flex-1 flex flex-col overflow-hidden bg-[#131722] border-r border-[#2a2e39]">

    <!-- Top Technical Performance Bar -->
    <div class="h-8 border-b border-[#2a2e39] bg-[#1a1e29] px-4 flex items-center justify-between text-xs font-mono overflow-x-auto whitespace-nowrap shrink-0">
      <div class="flex items-center space-x-4">
        <div><span class="text-gray-400">1Y Ret:</span> <span id="m-1y" class="font-bold text-white">--</span></div>
        <div><span class="text-gray-400">3Y CAGR:</span> <span id="m-3y" class="font-bold text-white">--</span></div>
        <div><span class="text-gray-400">5Y CAGR:</span> <span id="m-5y" class="font-bold text-white">--</span></div>
        <div><span class="text-gray-400">7Y CAGR:</span> <span id="m-7y" class="font-bold text-white">--</span></div>
        <div><span class="text-gray-400">10Y CAGR:</span> <span id="m-10y" class="font-bold text-white">--</span></div>
        <div><span class="text-gray-400">Pivot DD:</span> <span id="m-pdd" class="font-bold text-pink-500">--</span></div>
        <div><span class="text-gray-400">10YH DD:</span> <span id="m-athdd" class="font-bold text-pink-500">--</span></div>
        <div><span class="text-gray-400">ATR%:</span> <span id="m-atr" class="font-bold text-amber-400">--</span></div>
      </div>
    </div>

    <!-- Main Candlestick Chart Pane -->
    <div id="price-chart-container" class="relative"></div>

    <!-- Separator Border -->
    <div class="h-[1px] bg-[#2a2e39] w-full shrink-0"></div>

    <!-- Dedicated Synchronized Volume Chart Pane -->
    <div id="volume-chart-container" class="relative shrink-0"></div>
  </div>

  <!-- Sidebar: Watchlists -->
  <div class="w-80 bg-[#1e222d] flex flex-col shrink-0 border-l border-[#2a2e39]">

    <!-- Watchlist Selector Toolbar -->
    <div class="p-2 border-b border-[#2a2e39] flex items-center justify-between bg-[#171b26] space-x-2">
      <select id="watchlist-select"
              class="bg-[#2a2e39] text-white text-xs rounded px-2 py-1 flex-1 outline-none font-medium border border-[#363c4e] cursor-pointer">
      </select>
      <div class="flex items-center space-x-1 shrink-0">
        <button id="new-wl-btn" title="Create New Watchlist"
                class="text-xs px-2 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold">+</button>
        <button id="rename-wl-btn" title="Rename Watchlist"
                class="text-xs px-2 py-1 bg-[#2a2e39] hover:bg-[#363c4e] text-gray-300 rounded">✏️</button>
        <button id="delete-wl-btn" title="Delete Watchlist"
                class="text-xs px-2 py-1 bg-[#2a2e39] hover:bg-red-900/50 text-red-400 rounded">🗑️</button>
      </div>
    </div>

    <!-- Watchlist Items Header -->
    <div class="px-3 py-2 border-b border-[#2a2e39] flex items-center justify-between">
      <span class="font-bold text-xs text-gray-400 uppercase tracking-wider">Symbols</span>
      <div class="flex items-center space-x-1">
        <button id="add-section-btn" title="Add Section Header"
                class="text-xs px-2 py-0.5 bg-[#2a2e39] hover:bg-[#363c4e] text-gray-200 rounded">+ Section</button>
        <button id="add-ticker-btn" title="Add Ticker"
                class="text-xs px-2 py-0.5 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold">+ Symbol</button>
      </div>
    </div>

    <!-- Watchlist Items Container -->
    <div id="watchlist-items" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
  </div>

</div>

<!-- JavaScript Engine -->
<script>
  // 1. CONFIGURATION & PERSISTENT STATE
  // Auto-use local Worker when frontend is served from localhost.
  const WORKER_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:8787'
    : 'https://stock-proxy.vinodsrao.workers.dev';
  let currentSymbol = localStorage.getItem('quantview_symbol') || 'AAPL';
  let currentTimeframe = localStorage.getItem('quantview_tf') || '1d';
  let chartData = [];
  let priceChart, volumeChart, candleSeries, volumeSeries;

  const TIMEFRAME_MAP = {
    '1d': { range: '10y', interval: '1d', label: '1D' },
    '1w': { range: '10y', interval: '1wk', label: '1W' },
    '1M': { range: '10y', interval: '1mo', label: '1M' },
    '3M': { range: '10y', interval: '3mo', label: '3M' }
  };

  // Watchlist contents live in Cloudflare D1 (server-side). Only UI prefs
  // (active id, symbol, timeframe) stay in localStorage.
  // Default seed is inserted by the Worker on first GET /api/watchlists.
  let watchlists = [];
  let activeWatchlistId = localStorage.getItem('quantview_active_watchlist_id')
    ? Number(localStorage.getItem('quantview_active_watchlist_id'))
    : null;
  let watchlistsLoading = false;

  function getActiveWatchlist() {
    return watchlists.find(w => w.id === activeWatchlistId) || watchlists[0] || null;
  }

  function saveActiveWatchlistId() {
    if (activeWatchlistId != null) {
      localStorage.setItem('quantview_active_watchlist_id', String(activeWatchlistId));
    }
  }

  async function watchlistApi(path, method = 'GET', body) {
    const res = await fetch(`${WORKER_URL}/api${path}`, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Watchlist API error (${res.status})`);
    return data;
  }

  async function loadWatchlists() {
    watchlistsLoading = true;
    try {
      watchlists = await watchlistApi('/watchlists', 'GET');
      if (!watchlists.length) throw new Error('No watchlists returned from server');
      if (!watchlists.some(w => w.id === activeWatchlistId)) {
        activeWatchlistId = watchlists[0].id;
        saveActiveWatchlistId();
      }
    } catch (err) {
      console.error('Failed to load watchlists from D1:', err);
      const container = document.getElementById('watchlist-items');
      if (container && !watchlists.length) {
        container.innerHTML = `<div class="p-3 text-xs text-red-400">Watchlist DB unavailable: ${err.message}<br/>Check Worker D1 binding + migrations.</div>`;
      }
      throw err;
    } finally {
      watchlistsLoading = false;
    }
    renderWatchlistSelector();
    renderActiveWatchlist();
  }

  // Universal Candle Normalization Across All Timeframes
  function normalizeTimestamp(timeInSeconds, timeframeKey) {
    const date = new Date((timeInSeconds + 43200) * 1000);
    const year = date.getUTCFullYear();
    const month = date.getUTCMonth();

    if (timeframeKey === '1w') {
      const day = date.getUTCDay();
      const diffToMonday = (day === 0 ? -6 : 1 - day);
      const monday = new Date(date);
      monday.setUTCDate(date.getUTCDate() + diffToMonday);
      return Math.floor(Date.UTC(monday.getUTCFullYear(), monday.getUTCMonth(), monday.getUTCDate()) / 1000);
    }

    if (timeframeKey === '1M') {
      return Math.floor(Date.UTC(year, month, 1) / 1000);
    }

    if (timeframeKey === '3M') {
      const quarterStartMonth = Math.floor(month / 3) * 3;
      return Math.floor(Date.UTC(year, quarterStartMonth, 1) / 1000);
    }

    return timeInSeconds;
  }

  function formatGranularityLabel(granularity) {
    if (!granularity) return '';
    const g = granularity.toLowerCase();
    if (g === '1d' || g === '1day') return '1D';
    if (g === '1wk' || g === '1week') return '1W';
    if (g === '1mo' || g === '1month') return '1M';
    if (g === '3mo' || g === '3month') return '3M';
    return g.toUpperCase();
  }

  // 2. PINE SCRIPT MATH ENGINE
  function dynamicLookback(timeframeKey) {
    if (timeframeKey === '1d') return 21;
    if (timeframeKey === '1w') return 52;
    if (timeframeKey === '1M') return 12;
    if (timeframeKey === '3M') return 4;
    return 21;
  }

  function calculatePineMetrics(data, zThreshold = 1.0) {
    const len = dynamicLookback(currentTimeframe);
    const volumes = data.map(d => d.volume);
    let runningAthPeak = 0;

    function findBarAtTime(targetTime) {
      if (!data.length || targetTime < data[0].time - (45 * 86400)) return null;
      let low = 0, high = data.length - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (data[mid].time < targetTime) {
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }
      let closest = low;
      if (low > 0 && (low >= data.length || Math.abs(data[low - 1].time - targetTime) < Math.abs(data[low].time - targetTime))) {
        closest = low - 1;
      }
      if (closest < 0 || closest >= data.length) return null;
      if (Math.abs(data[closest].time - targetTime) > 45 * 86400) return null;
      return data[closest];
    }

    return data.map((bar, i) => {
      const sliceVol = volumes.slice(Math.max(0, i - len + 1), i + 1);
      const avgVol = sliceVol.reduce((a, b) => a + b, 0) / sliceVol.length;
      const variance = sliceVol.reduce((a, b) => a + Math.pow(b - avgVol, 2), 0) / sliceVol.length;
      const stdVol = Math.sqrt(variance) || 0.0001;

      let trSum = 0;
      const start = Math.max(0, i - len + 1);
      for (let j = start; j <= i; j++) {
        const prevClose = j > 0 ? data[j - 1].close : data[j].open;
        const tr = Math.max(
          data[j].high - data[j].low,
          Math.abs(data[j].high - prevClose),
          Math.abs(data[j].low - prevClose)
        );
        trSum += tr;
      }
      const atr = trSum / (i - start + 1);

      const mintick = 0.0001;
      const zScore = (bar.volume - avgVol) / Math.max(stdVol, mintick);
      const vRatio = bar.volume / Math.max(avgVol, 1);
      const priceRange = Math.max(bar.high - bar.low, mintick);
      const clv = (bar.close - bar.low) / priceRange;
      const pChg = i > 0 ? bar.close - data[i - 1].close : 0;
      const pMoveInten = Math.abs(pChg) / Math.max(atr, mintick);

      const prevClose = i > 0 ? data[i - 1].close : bar.open;
      const isChurn = zScore > zThreshold && pMoveInten < 0.3;
      const isAccu = zScore > zThreshold && !isChurn && pChg > (-0.5 * atr) && ((bar.close > prevClose && clv > 0.4) || clv > 0.8);
      const isDist = zScore > zThreshold && !isChurn && (pChg < -atr || (bar.close < prevClose && clv < 0.6) || clv < 0.2);

      const decay = 1.0;
      const basePower = vRatio * pMoveInten * decay;
      const powerAccu = basePower * clv;
      const powerDist = basePower * (1 - clv);

      const accuTransp = Math.min(100, Math.max(0, 100 - Math.floor(powerAccu * 60)));
      const distTransp = Math.min(100, Math.max(0, 100 - Math.floor(powerDist * 60)));

      const accuAlpha = (100 - accuTransp) / 100;
      const distAlpha = (100 - distTransp) / 100;

      const isBullish = bar.close >= bar.open;
      let color = isBullish ? '#b2b5be' : '#4c525e';
      let wickColor = isBullish ? '#b2b5be' : '#848b9a';
      let borderColor = color;
      let signalTag = 'NEUTRAL';

      if (isChurn) {
        color = 'rgba(39, 156, 245, 0.7)';
        wickColor = 'rgba(39, 156, 245, 0.5)';
        borderColor = color;
        signalTag = 'CHURN';
      } else if (isAccu) {
        color = `rgba(156, 245, 39, ${accuAlpha.toFixed(2)})`;
        wickColor = 'rgba(156, 245, 39, 0.5)';
        borderColor = color;
        signalTag = 'ACCUMULATION';
      } else if (isDist) {
        color = `rgba(245, 39, 156, ${distAlpha.toFixed(2)})`;
        wickColor = 'rgba(245, 39, 156, 0.5)';
        borderColor = color;
        signalTag = 'DISTRIBUTION';
      }

      const bar1y = findBarAtTime(bar.time - (365.25 * 86400));
      const bar3y = findBarAtTime(bar.time - (3 * 365.25 * 86400));
      const bar5y = findBarAtTime(bar.time - (5 * 365.25 * 86400));
      const bar7y = findBarAtTime(bar.time - (7 * 365.25 * 86400));
      const bar10y = findBarAtTime(bar.time - (10 * 365.25 * 86400));

      const ret1y = bar1y ? (((bar.close - bar1y.close) / bar1y.close) * 100) : NaN;
      const cagr3y = bar3y ? ((Math.pow(bar.close / bar3y.close, 1 / 3) - 1) * 100) : NaN;
      const cagr5y = bar5y ? ((Math.pow(bar.close / bar5y.close, 1 / 5) - 1) * 100) : NaN;
      const cagr7y = bar7y ? ((Math.pow(bar.close / bar7y.close, 1 / 7) - 1) * 100) : NaN;
      const cagr10y = bar10y ? ((Math.pow(bar.close / bar10y.close, 1 / 10) - 1) * 100) : NaN;

      runningAthPeak = Math.max(runningAthPeak, bar.high);
      const athDD = runningAthPeak > 0 ? ((bar.close - runningAthPeak) / runningAthPeak) * 100 : 0;

      const pivotStart = Math.max(0, i - 50);
      let pivotPeak = 0;
      for (let p = pivotStart; p <= i; p++) {
        if (data[p].high > pivotPeak) pivotPeak = data[p].high;
      }
      const pivotDD = pivotPeak > 0 ? ((bar.close - pivotPeak) / pivotPeak) * 100 : 0;

      return {
        ...bar,
        color,
        wickColor,
        borderColor,
        signalTag,
        atrPct: ((atr / bar.close) * 100).toFixed(2),
        ret1y: isNaN(ret1y) ? '--' : ret1y.toFixed(1) + '%',
        cagr3y: isNaN(cagr3y) ? '--' : cagr3y.toFixed(1) + '%',
        cagr5y: isNaN(cagr5y) ? '--' : cagr5y.toFixed(1) + '%',
        cagr7y: isNaN(cagr7y) ? '--' : cagr7y.toFixed(1) + '%',
        cagr10y: isNaN(cagr10y) ? '--' : cagr10y.toFixed(1) + '%',
        pivotDD: pivotDD.toFixed(1) + '%',
        athDD: athDD.toFixed(1) + '%'
      };
    });
  }

  // 3. CHART INITIALIZATION
  function initCharts() {
    const priceContainer = document.getElementById('price-chart-container');
    const volumeContainer = document.getElementById('volume-chart-container');

    if (!priceContainer || !volumeContainer) return;

    const pHeight = priceContainer.clientHeight || 400;
    const vHeight = volumeContainer.clientHeight || 128;

    priceChart = LightweightCharts.createChart(priceContainer, {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
      timeScale: { rightOffset: 5, barSpacing: 10 },
      height: pHeight,
      rightPriceScale: { minimumWidth: 75, mode: 1 },
      watermark: {
        visible: true,
        fontSize: 100,
        horzAlign: 'center',
        vertAlign: 'center',
        color: 'rgba(255, 255, 255, 0.06)',
        text: currentSymbol + ' • ' + (TIMEFRAME_MAP[currentTimeframe]?.label || '1D'),
        fontFamily: 'sans-serif'
      }
    });

    volumeChart = LightweightCharts.createChart(volumeContainer, {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
      timeScale: { rightOffset: 5, barSpacing: 10 },
      height: vHeight,
      rightPriceScale: { minimumWidth: 75, mode: 0 }
    });

    candleSeries = priceChart.addCandlestickSeries();
    volumeSeries = volumeChart.addHistogramSeries({ priceFormat: { type: 'volume' } });

    priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      volumeChart.timeScale().setVisibleLogicalRange(range);
    });
    volumeChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      priceChart.timeScale().setVisibleLogicalRange(range);
    });

    priceChart.subscribeCrosshairMove(param => updateStatusBar(param));
    volumeChart.subscribeCrosshairMove(param => updateStatusBar(param));

    setupTimeframeListeners();
  }

  function setupTimeframeListeners() {
    const buttons = document.querySelectorAll('.tf-btn');

    buttons.forEach(btn => {
      const tf = btn.getAttribute('data-tf');
      if (tf === currentTimeframe) {
        btn.classList.add('bg-[#2a2e39]', 'text-blue-400');
        btn.classList.remove('text-gray-400');
      } else {
        btn.classList.remove('bg-[#2a2e39]', 'text-blue-400');
        btn.classList.add('text-gray-400');
      }

      btn.addEventListener('click', (e) => {
        buttons.forEach(b => {
          b.classList.remove('bg-[#2a2e39]', 'text-blue-400');
          b.classList.add('text-gray-400');
        });

        e.target.classList.add('bg-[#2a2e39]', 'text-blue-400');
        e.target.classList.remove('text-gray-400');

        currentTimeframe = e.target.getAttribute('data-tf');
        localStorage.setItem('quantview_tf', currentTimeframe);

        loadData(currentSymbol, currentTimeframe);
      });
    });
  }

  function updateStatusBar(param) {
    if (!param || !param.time || !chartData.length) {
      if (chartData.length) renderMetricsForBar(chartData[chartData.length - 1]);
      return;
    }
    const bar = chartData.find(d => d.time === param.time);
    if (bar) renderMetricsForBar(bar);
  }

  function renderMetricsForBar(bar) {
    document.getElementById('hud-o').innerText = bar.open.toFixed(2);
    document.getElementById('hud-h').innerText = bar.high.toFixed(2);
    document.getElementById('hud-l').innerText = bar.low.toFixed(2);
    document.getElementById('hud-c').innerText = bar.close.toFixed(2);
    document.getElementById('hud-v').innerText = bar.volume.toLocaleString();

    const sig = document.getElementById('hud-signal');
    sig.innerText = bar.signalTag;
    sig.className = `px-1.5 py-0.5 rounded text-[10px] font-sans font-bold ${
      bar.signalTag === 'ACCUMULATION' ? 'bg-green-900/80 text-green-300' :
      bar.signalTag === 'DISTRIBUTION' ? 'bg-pink-900/80 text-pink-300' :
      bar.signalTag === 'CHURN' ? 'bg-blue-900/80 text-blue-300' : 'bg-gray-800 text-gray-400'
    }`;

    document.getElementById('m-1y').innerText = bar.ret1y;
    document.getElementById('m-3y').innerText = bar.cagr3y;
    document.getElementById('m-5y').innerText = bar.cagr5y;
    document.getElementById('m-7y').innerText = bar.cagr7y;
    document.getElementById('m-10y').innerText = bar.cagr10y;
    document.getElementById('m-pdd').innerText = bar.pivotDD;
    document.getElementById('m-athdd').innerText = bar.athDD;
    document.getElementById('m-atr').innerText = bar.atrPct + '%';
  }

  // 4. DATA FETCHING ENGINE & YAHOO METADATA WATERMARK
  async function loadData(symbol, tfKey = '1d') {
    const tfConfig = TIMEFRAME_MAP[tfKey] || TIMEFRAME_MAP['1d'];
    const badge = document.getElementById('data-source-badge');
    if (badge) {
      badge.innerText = 'PROXY FETCHING...';
      badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-amber-900/50 text-amber-400 border border-amber-700/50 font-mono';
    }

    try {
      const url = `${WORKER_URL}?symbol=${encodeURIComponent(symbol)}&range=${tfConfig.range}&interval=${tfConfig.interval}`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Proxy error: ${response.statusText}`);
      }

      const data = await response.json();
      const result = data.chart.result[0];
      const meta = result.meta || {};

      const returnedSymbol = meta.symbol || symbol;
      const returnedGranularity = meta.dataGranularity || meta.granularity || tfConfig.interval;
      const periodLabel = formatGranularityLabel(returnedGranularity);

      if (priceChart) {
        priceChart.applyOptions({
          watermark: {
            visible: true,
            text: `${returnedSymbol} • ${periodLabel}`,
            color: 'rgba(255, 255, 255, 0.06)',
            fontSize: 100,
            horzAlign: 'center',
            vertAlign: 'center',
            fontFamily: 'sans-serif'
          }
        });
      }

      const timestamps = result.timestamp || [];
      const quote = result.indicators.quote[0];

      const raw = [];
      const timestampMap = new Map();

      for (let i = 0; i < timestamps.length; i++) {
        if (
          quote.open[i] != null &&
          quote.high[i] != null &&
          quote.low[i] != null &&
          quote.close[i] != null
        ) {
          const normalizedTime = normalizeTimestamp(timestamps[i], tfKey);

          if (timestampMap.has(normalizedTime)) {
            const existingBar = timestampMap.get(normalizedTime);
            existingBar.high = Math.max(existingBar.high, quote.high[i]);
            existingBar.low = Math.min(existingBar.low, quote.low[i]);
            existingBar.close = quote.close[i];
            existingBar.volume += (quote.volume[i] || 0);
          } else {
            const newBar = {
              time: normalizedTime,
              open: quote.open[i],
              high: quote.high[i],
              low: quote.low[i],
              close: quote.close[i],
              volume: quote.volume[i] || 0
            };
            timestampMap.set(normalizedTime, newBar);
            raw.push(newBar);
          }
        }
      }

      chartData = calculatePineMetrics(raw);

      candleSeries.setData(chartData.map(d => ({
        time: d.time,
        open: d.open,
        high: d.high,
        low: d.low,
        close: d.close,
        color: d.color,
        wickColor: d.wickColor,
        borderColor: d.borderColor
      })));

      volumeSeries.setData(chartData.map(d => ({
        time: d.time,
        value: d.volume,
        color: d.color
      })));

      const totalBars = chartData.length;
      if (totalBars > 0) {
        let visibleCount = 120;
        if (tfKey === '1w') visibleCount = 52;
        if (tfKey === '1M') visibleCount = 48;
        if (tfKey === '3M') visibleCount = 20;

        const logicalRange = {
          from: totalBars - Math.min(totalBars, visibleCount),
          to: totalBars + 2
        };
        priceChart.timeScale().setVisibleLogicalRange(logicalRange);
        volumeChart.timeScale().setVisibleLogicalRange(logicalRange);
      }

      renderMetricsForBar(chartData[chartData.length - 1]);

      if (badge) {
        badge.innerText = 'PROXY LIVE';
        badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-green-900/50 text-green-400 border border-green-700/50 font-mono';
      }
    } catch (err) {
      console.error("Error loading proxy data:", err);
      if (badge) {
        badge.innerText = 'FETCH ERROR';
        badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-red-900/50 text-red-400 border border-red-700/50 font-mono';
      }
    }
  }

  // 5. WATCHLIST ENGINE (Cloudflare D1-backed)
  let draggedItemId = null;

  function renderWatchlistSelector() {
    const select = document.getElementById('watchlist-select');
    if (!select) return;
    select.innerHTML = '';

    watchlists.forEach(wl => {
      const option = document.createElement('option');
      option.value = String(wl.id);
      option.innerText = wl.name;
      if (wl.id === activeWatchlistId) option.selected = true;
      select.appendChild(option);
    });
  }

  function renderActiveWatchlist() {
    const container = document.getElementById('watchlist-items');
    if (!container) return;
    container.innerHTML = '';

    const active = getActiveWatchlist();
    if (!active) {
      container.innerHTML = '<div class="p-3 text-xs text-gray-500">No watchlists yet. Create one with +.</div>';
      return;
    }
    const items = active.items || [];

    items.forEach((item) => {
      const div = document.createElement('div');
      div.setAttribute('draggable', 'true');
      div.setAttribute('data-id', String(item.id));

      if (item.type === 'section') {
        div.className = 'text-[11px] font-bold text-gray-400 pt-3 pb-1 px-2 border-b border-[#2a2e39] flex justify-between items-center cursor-grab active:cursor-grabbing transition-all border-t-2 border-t-transparent';
        const span = document.createElement('span');
        span.textContent = item.title || '';
        const btn = document.createElement('button');
        btn.className = 'text-gray-500 hover:text-red-400';
        btn.textContent = '×';
        btn.onclick = (e) => { e.stopPropagation(); removeWatchlistItem(item.id); };
        div.append(span, btn);
      } else {
        div.className = `p-2 rounded flex justify-between items-center cursor-grab active:cursor-grabbing hover:bg-[#2a2e39] transition-all border-t-2 border-t-transparent ${
          item.symbol === currentSymbol ? 'bg-[#2a2e39] border-l-2 border-l-blue-500' : ''
        }`;
        div.onclick = () => {
          currentSymbol = item.symbol;
          localStorage.setItem('quantview_symbol', currentSymbol);
          document.getElementById('symbol-display').innerText = item.symbol;
          loadData(item.symbol, currentTimeframe);
          renderActiveWatchlist();
        };

        const wrap = document.createElement('div');
        wrap.className = 'pointer-events-none';
        const sym = document.createElement('div');
        sym.className = 'font-bold text-xs text-white';
        sym.textContent = item.symbol || '';
        wrap.appendChild(sym);
        const btn = document.createElement('button');
        btn.className = 'text-gray-500 hover:text-red-400 text-xs';
        btn.textContent = '×';
        btn.onclick = (e) => { e.stopPropagation(); removeWatchlistItem(item.id); };
        div.append(wrap, btn);
      }

      div.addEventListener('dragstart', (e) => {
        draggedItemId = item.id;
        e.dataTransfer.effectAllowed = 'move';
        div.classList.add('opacity-40');
      });

      div.addEventListener('dragend', () => {
        draggedItemId = null;
        div.classList.remove('opacity-40');
        clearDropIndicators();
      });

      div.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        clearDropIndicators();
        div.classList.add('border-t-blue-500');
      });

      div.addEventListener('dragleave', () => {
        div.classList.remove('border-t-blue-500');
      });

      div.addEventListener('drop', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        clearDropIndicators();

        const targetId = Number(div.getAttribute('data-id'));
        if (draggedItemId === null || draggedItemId === targetId) return;
        await moveWatchlistItem(draggedItemId, targetId);
      });

      container.appendChild(div);
    });
  }

  function clearDropIndicators() {
    const container = document.getElementById('watchlist-items');
    if (!container) return;
    Array.from(container.children).forEach(child => {
      child.classList.remove('border-t-blue-500');
    });
  }

  async function moveWatchlistItem(draggedId, targetId) {
    const active = getActiveWatchlist();
    if (!active) return;
    const ids = (active.items || []).map(i => i.id);
    const from = ids.indexOf(draggedId);
    const to = ids.indexOf(targetId);
    if (from < 0 || to < 0) return;
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    // Optimistic reorder
    active.items.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
    renderActiveWatchlist();
    try {
      await watchlistApi(`/watchlists/${active.id}/items/order`, 'PUT', { orderedIds: ids });
      await loadWatchlists();
    } catch (err) {
      console.error('Reorder failed:', err);
      await loadWatchlists();
    }
  }

  async function removeWatchlistItem(itemId) {
    const active = getActiveWatchlist();
    if (!active) return;
    try {
      await watchlistApi(`/watchlists/${active.id}/items/${itemId}`, 'DELETE');
      await loadWatchlists();
    } catch (err) {
      console.error('Delete item failed:', err);
      alert(`Could not delete symbol: ${err.message}`);
    }
  }
  // Exposed for any legacy inline handlers (now using addEventListener, kept for safety)
  window.removeWatchlistItem = removeWatchlistItem;

  function setupWatchlistControls() {
    const select = document.getElementById('watchlist-select');
    const newBtn = document.getElementById('new-wl-btn');
    const renameBtn = document.getElementById('rename-wl-btn');
    const deleteBtn = document.getElementById('delete-wl-btn');

    if (select) {
      select.onchange = (e) => {
        activeWatchlistId = Number(e.target.value);
        saveActiveWatchlistId();
        renderActiveWatchlist();
      };
    }

    if (newBtn) {
      newBtn.onclick = async () => {
        const name = prompt("Enter new watchlist name:");
        if (name && name.trim()) {
          try {
            const created = await watchlistApi('/watchlists', 'POST', { name: name.trim() });
            activeWatchlistId = created.id;
            saveActiveWatchlistId();
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    if (renameBtn) {
      renameBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const newName = prompt(`Rename watchlist "${active.name}" to:`, active.name);
        if (newName && newName.trim() && newName.trim() !== active.name) {
          try {
            await watchlistApi(`/watchlists/${active.id}`, 'PUT', { name: newName.trim() });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    if (deleteBtn) {
      deleteBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        if (watchlists.length <= 1) {
          alert("You must keep at least one watchlist.");
          return;
        }
        if (confirm(`Are you sure you want to delete the watchlist "${active.name}"?`)) {
          try {
            await watchlistApi(`/watchlists/${active.id}`, 'DELETE');
            activeWatchlistId = null;
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    const addSectionBtn = document.getElementById('add-section-btn');
    if (addSectionBtn) {
      addSectionBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const title = prompt("Enter section header name:", "### NEW SECTION");
        if (title) {
          try {
            await watchlistApi(`/watchlists/${active.id}/items`, 'POST', { type: 'section', title });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    const addTickerBtn = document.getElementById('add-ticker-btn');
    if (addTickerBtn) {
      addTickerBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const sym = prompt("Enter Yahoo ticker symbol (e.g., AAPL, PH, TVSMOTOR.NS, BTC-USD):");
        if (sym && sym.trim()) {
          try {
            await watchlistApi(`/watchlists/${active.id}/items`, 'POST', { type: 'ticker', symbol: sym.trim() });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    initCharts();
    setupWatchlistControls();

    const symbolDisplay = document.getElementById('symbol-display');
    if (symbolDisplay) symbolDisplay.innerText = currentSymbol;

    loadData(currentSymbol, currentTimeframe);
    try {
      await loadWatchlists();
    } catch {
      renderWatchlistSelector();
      renderActiveWatchlist();
    }
  });
</script>
