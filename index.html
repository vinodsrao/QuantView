      width: 100%;
      margin: 0;

<!-- JavaScript Engine -->
<script>
  // 1. CONFIGURATION & PERSISTENT STATE
  // Auto-use local Worker when frontend is served from localhost.
  const WORKER_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:8787'
    : 'https://stock-proxy.vinodsrao.workers.dev';
  let currentSymbol = localStorage.getItem('quantview_symbol') || 'AAPL';
  const NUM_PANES = 3;
  const panes = [];
  function defaultTfForPane(i) { return ['1d', '1w', '1M'][i] || '1d'; }
  function paneTfStorageKey(i) { return 'quantview_tf_pane_' + i; }
  function getPaneTf(i) { return localStorage.getItem(paneTfStorageKey(i)) || defaultTfForPane(i); }

  const TIMEFRAME_MAP = {
    '1d': { range: '10y', interval: '1d', label: '1D' },
    '1w': { range: '10y', interval: '1wk', label: '1W' },
    '1M': { range: '10y', interval: '1mo', label: '1M' },
    '3M': { range: '10y', interval: '3mo', label: '3M' }
  };

  // Watchlist contents live in Cloudflare D1 (server-side). Only UI prefs
  // (active id, symbol, timeframe) stay in localStorage.
  // Default seed is inserted by the Worker on first GET /api/watchlists.
  let watchlists = [];
  let activeWatchlistId = localStorage.getItem('quantview_active_watchlist_id')
    ? Number(localStorage.getItem('quantview_active_watchlist_id'))
    : null;
  let watchlistsLoading = false;

  // Search state
  let searchDebounceTimer = null;
  let searchResults = [];
  let searchSelectedIndex = -1;
  let searchInput = null;
  let searchResultsEl = null;

  function getActiveWatchlist() {
    return watchlists.find(w => w.id === activeWatchlistId) || watchlists[0] || null;
  }

  function saveActiveWatchlistId() {
    if (activeWatchlistId != null) {
      localStorage.setItem('quantview_active_watchlist_id', String(activeWatchlistId));
    }
  }

  async function watchlistApi(path, method = 'GET', body) {
    const res = await fetch(`${WORKER_URL}/api${path}`, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Watchlist API error (${res.status})`);
    return data;
  }

  async function loadWatchlists() {
    watchlistsLoading = true;
    try {
      watchlists = await watchlistApi('/watchlists', 'GET');
      if (!watchlists.length) throw new Error('No watchlists returned from server');
      if (!watchlists.some(w => w.id === activeWatchlistId)) {
        activeWatchlistId = watchlists[0].id;
        saveActiveWatchlistId();
      }
    } catch (err) {
      console.error('Failed to load watchlists from D1:', err);
      const container = document.getElementById('watchlist-items');
      if (container && !watchlists.length) {
        container.innerHTML = `<div class="p-3 text-xs text-red-400">Watchlist DB unavailable: ${err.message}<br/>Check Worker D1 binding + migrations.</div>`;
      }
      throw err;
    } finally {
      watchlistsLoading = false;
    }
    renderWatchlistSelector();
    renderActiveWatchlist();
  }

  // Universal Candle Normalization Across All Timeframes
  function normalizeTimestamp(timeInSeconds, timeframeKey) {
    const date = new Date((timeInSeconds + 43200) * 1000);
    const year = date.getUTCFullYear();
    const month = date.getUTCMonth();

    if (timeframeKey === '1w') {
      const day = date.getUTCDay();
      const diffToMonday = (day === 0 ? -6 : 1 - day);
      const monday = new Date(date);
      monday.setUTCDate(date.getUTCDate() + diffToMonday);
      return Math.floor(Date.UTC(monday.getUTCFullYear(), monday.getUTCMonth(), monday.getUTCDate()) / 1000);
    }

    if (timeframeKey === '1M') {
      return Math.floor(Date.UTC(year, month, 1) / 1000);
    }

    if (timeframeKey === '3M') {
      const quarterStartMonth = Math.floor(month / 3) * 3;
      return Math.floor(Date.UTC(year, quarterStartMonth, 1) / 1000);
    }

    return timeInSeconds;
  }

  function formatGranularityLabel(granularity) {
    if (!granularity) return '';
    const g = granularity.toLowerCase();
    if (g === '1d' || g === '1day') return '1D';
    if (g === '1wk' || g === '1week') return '1W';
    if (g === '1mo' || g === '1month') return '1M';
    if (g === '3mo' || g === '3month') return '3M';
    return g.toUpperCase();
  }

  // 2. PINE SCRIPT MATH ENGINE
  function dynamicLookback(timeframeKey) {
    if (timeframeKey === '1d') return 21;
    if (timeframeKey === '1w') return 52;
    if (timeframeKey === '1M') return 12;
    if (timeframeKey === '3M') return 4;
    return 21;
  }

  function tradingDaysPerBar(timeframeKey) {
    if (timeframeKey === '1d') return 1;
    if (timeframeKey === '1w') return 5;
    if (timeframeKey === '1M') return 21;
    if (timeframeKey === '3M') return 63;
    return 1;
  }

  function formatCurrencyVolume(val, isInr) {
    if (val == null || !isFinite(val) || val < 0) return '--';
    const abs = Math.abs(val);
    if (isInr) {
      return '₹' + (abs / 1e7).toFixed(2) + 'Cr';
    }
    return '$' + (abs / 1e6).toFixed(2) + 'M';
  }

  function calculatePineMetrics(data, tfKey, symbol, zThreshold = 1.0) {
    const len = dynamicLookback(tfKey);
    const isInr = String(symbol || currentSymbol).endsWith('.NS');
    const volumes = data.map(d => d.volume);
    let runningAthPeak = 0;

    function findBarAtTime(targetTime) {
      if (!data.length || targetTime < data[0].time - (45 * 86400)) return null;
      let low = 0, high = data.length - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (data[mid].time < targetTime) {
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }
      let closest = low;
      if (low > 0 && (low >= data.length || Math.abs(data[low - 1].time - targetTime) < Math.abs(data[low].time - targetTime))) {
        closest = low - 1;
      }
      if (closest < 0 || closest >= data.length) return null;
      if (Math.abs(data[closest].time - targetTime) > 45 * 86400) return null;
      return data[closest];
    }

    return data.map((bar, i) => {
      const sliceVol = volumes.slice(Math.max(0, i - len + 1), i + 1);
      const avgVol = sliceVol.reduce((a, b) => a + b, 0) / sliceVol.length;
      const variance = sliceVol.reduce((a, b) => a + Math.pow(b - avgVol, 2), 0) / sliceVol.length;
      const stdVol = Math.sqrt(variance) || 0.0001;

      let trSum = 0;
      const start = Math.max(0, i - len + 1);
      for (let j = start; j <= i; j++) {
        const prevClose = j > 0 ? data[j - 1].close : data[j].open;
        const tr = Math.max(
          data[j].high - data[j].low,
          Math.abs(data[j].high - prevClose),
          Math.abs(data[j].low - prevClose)
        );
        trSum += tr;
      }
      const atr = trSum / (i - start + 1);

      const volSlice = data.slice(Math.max(0, i - len + 1), i + 1);
      const avgCurrencyVolPerBar = volSlice.reduce((sum, d) => sum + (d.close * (d.volume || 0)), 0) / volSlice.length;
      const avgCurrencyVol = avgCurrencyVolPerBar / tradingDaysPerBar(tfKey);

      const mintick = 0.0001;
      const zScore = (bar.volume - avgVol) / Math.max(stdVol, mintick);
      const vRatio = bar.volume / Math.max(avgVol, 1);
      const priceRange = Math.max(bar.high - bar.low, mintick);
      const clv = (bar.close - bar.low) / priceRange;
      const pChg = i > 0 ? bar.close - data[i - 1].close : 0;
      const pMoveInten = Math.abs(pChg) / Math.max(atr, mintick);

      const prevClose = i > 0 ? data[i - 1].close : bar.open;
      const isChurn = zScore > zThreshold && pMoveInten < 0.3;
      const isAccu = zScore > zThreshold && !isChurn && pChg > (-0.5 * atr) && ((bar.close > prevClose && clv > 0.4) || clv > 0.8);
      const isDist = zScore > zThreshold && !isChurn && (pChg < -atr || (bar.close < prevClose && clv < 0.6) || clv < 0.2);

      const decay = 1.0;
      const basePower = vRatio * pMoveInten * decay;
      const powerAccu = basePower * clv;
      const powerDist = basePower * (1 - clv);

      const accuTransp = Math.min(100, Math.max(0, 100 - Math.floor(powerAccu * 60)));
      const distTransp = Math.min(100, Math.max(0, 100 - Math.floor(powerDist * 60)));

      const accuAlpha = (100 - accuTransp) / 100;
      const distAlpha = (100 - distTransp) / 100;

      const isBullish = bar.close >= bar.open;
      let color = isBullish ? '#b2b5be' : '#4c525e';
      let wickColor = isBullish ? '#b2b5be' : '#848b9a';
      let borderColor = color;
      let signalTag = 'NEUTRAL';

      if (isChurn) {
        color = 'rgba(39, 156, 245, 0.7)';
        wickColor = 'rgba(39, 156, 245, 0.5)';
        borderColor = color;
        signalTag = 'CHURN';
      } else if (isAccu) {
        color = `rgba(156, 245, 39, ${accuAlpha.toFixed(2)})`;
        wickColor = 'rgba(156, 245, 39, 0.5)';
        borderColor = color;
        signalTag = 'ACCUMULATION';
      } else if (isDist) {
        color = `rgba(245, 39, 156, ${distAlpha.toFixed(2)})`;
        wickColor = 'rgba(245, 39, 156, 0.5)';
        borderColor = color;
        signalTag = 'DISTRIBUTION';
      }

      const bar1y = findBarAtTime(bar.time - (365.25 * 86400));
      const bar3y = findBarAtTime(bar.time - (3 * 365.25 * 86400));
      const bar5y = findBarAtTime(bar.time - (5 * 365.25 * 86400));
      const bar7y = findBarAtTime(bar.time - (7 * 365.25 * 86400));
      const bar10y = findBarAtTime(bar.time - (10 * 365.25 * 86400));

      const ret1y = bar1y ? (((bar.close - bar1y.close) / bar1y.close) * 100) : NaN;
      const cagr3y = bar3y ? ((Math.pow(bar.close / bar3y.close, 1 / 3) - 1) * 100) : NaN;
      const cagr5y = bar5y ? ((Math.pow(bar.close / bar5y.close, 1 / 5) - 1) * 100) : NaN;
      const cagr7y = bar7y ? ((Math.pow(bar.close / bar7y.close, 1 / 7) - 1) * 100) : NaN;
      const cagr10y = bar10y ? ((Math.pow(bar.close / bar10y.close, 1 / 10) - 1) * 100) : NaN;

      runningAthPeak = Math.max(runningAthPeak, bar.high);
      const athDD = runningAthPeak > 0 ? ((bar.close - runningAthPeak) / runningAthPeak) * 100 : 0;

      const pivotStart = Math.max(0, i - 50);
      let pivotPeak = 0;
      for (let p = pivotStart; p <= i; p++) {
        if (data[p].high > pivotPeak) pivotPeak = data[p].high;
      }
      const pivotDD = pivotPeak > 0 ? ((bar.close - pivotPeak) / pivotPeak) * 100 : 0;

      const prevCloseForChg = i > 0 ? data[i - 1].close : null;
      const chg = prevCloseForChg ? ((bar.close - prevCloseForChg) / prevCloseForChg) * 100 : NaN;

      return {
        ...bar,
        color,
        wickColor,
        borderColor,
        signalTag,
        atrPct: ((atr / bar.close) * 100).toFixed(2),
        chg: isNaN(chg) ? '--' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%',
        ret1y: isNaN(ret1y) ? '--' : ret1y.toFixed(1) + '%',
        cagr3y: isNaN(cagr3y) ? '--' : cagr3y.toFixed(1) + '%',
        cagr5y: isNaN(cagr5y) ? '--' : cagr5y.toFixed(1) + '%',
        cagr7y: isNaN(cagr7y) ? '--' : cagr7y.toFixed(1) + '%',
        cagr10y: isNaN(cagr10y) ? '--' : cagr10y.toFixed(1) + '%',
        pivotDD: pivotDD.toFixed(1) + '%',
        athDD: athDD.toFixed(1) + '%',
        avgVolCur: formatCurrencyVolume(avgCurrencyVol, isInr)
      };
    });
  }

  // 3. CHART INITIALIZATION
  function activateTfButton(btn) {
    btn.classList.add('bg-[#2a2e39]', 'text-blue-400');
    btn.classList.remove('text-gray-400');
  }
  function deactivateTfButton(btn) {
    btn.classList.remove('bg-[#2a2e39]', 'text-blue-400');
    btn.classList.add('text-gray-400');
  }

  function initAllCharts() {
    for (let i = 0; i < NUM_PANES; i++) createPane(i);
  }

  function createPane(i) {
    const priceContainer = document.getElementById('pane-' + i + '-price');
    const volumeContainer = document.getElementById('pane-' + i + '-volume');
    if (!priceContainer || !volumeContainer) return null;

    const pane = {
      i,
      tf: getPaneTf(i),
      priceContainer,
      volumeContainer,
      priceChart: null,
      volumeChart: null,
      candleSeries: null,
      volumeSeries: null,
      chartData: [],
    };

    const pHeight = priceContainer.clientHeight || 300;
    const vHeight = volumeContainer.clientHeight || 80;

    pane.priceChart = LightweightCharts.createChart(priceContainer, {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc', fontSize: 8 },
      grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
      timeScale: { rightOffset: 5, barSpacing: 10 },
      height: pHeight,
      rightPriceScale: { minimumWidth: 30, mode: 1 },
      watermark: {
        visible: true,
        fontSize: 48,
        horzAlign: 'center',
        vertAlign: 'center',
        color: 'rgba(255, 255, 255, 0.06)',
        text: currentSymbol + ' • ' + (TIMEFRAME_MAP[pane.tf]?.label || '1D'),
        fontFamily: 'sans-serif'
      }
    });

    pane.volumeChart = LightweightCharts.createChart(volumeContainer, {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc', fontSize: 8 },
      grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
      timeScale: { rightOffset: 5, barSpacing: 10 },
      height: vHeight,
      rightPriceScale: { minimumWidth: 30, mode: 0 }
    });

    pane.candleSeries = pane.priceChart.addCandlestickSeries();
    pane.volumeSeries = pane.volumeChart.addHistogramSeries({ priceFormat: { type: 'volume' } });

    pane.priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      pane.volumeChart.timeScale().setVisibleLogicalRange(range);
    });
    pane.volumeChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      pane.priceChart.timeScale().setVisibleLogicalRange(range);
    });

    pane.priceChart.subscribeCrosshairMove(param => updateStatusBar(param, pane));
    pane.volumeChart.subscribeCrosshairMove(param => updateStatusBar(param, pane));

    const group = document.querySelector('.tf-group[data-pane="' + i + '"]');
    const buttons = group ? group.querySelectorAll('.tf-btn') : [];
    buttons.forEach(btn => {
      const tf = btn.getAttribute('data-tf');
      if (tf === pane.tf) activateTfButton(btn); else deactivateTfButton(btn);
      btn.addEventListener('click', () => {
        buttons.forEach(deactivateTfButton);
        activateTfButton(btn);
        pane.tf = tf;
        localStorage.setItem(paneTfStorageKey(i), tf);
        loadPaneData(pane, currentSymbol, tf);
      });
    });

    const ro = new ResizeObserver(() => {
      const ph = priceContainer.clientHeight || 1;
      const vh = volumeContainer.clientHeight || 1;
      pane.priceChart.applyOptions({ height: ph });
      pane.volumeChart.applyOptions({ height: vh });
    });
    ro.observe(priceContainer);
    ro.observe(volumeContainer);

    panes.push(pane);
    return pane;
  }

  function updateStatusBar(param, pane) {
    const data = pane ? pane.chartData : (panes[0] ? panes[0].chartData : []);
    if (!param || !param.time || !data.length) {
      if (data.length) renderMetricsForBar(data[data.length - 1]);
      return;
    }
    const bar = data.find(d => d.time === param.time);
    if (bar) {
      renderMetricsForBar(bar);
      if (pane) renderPaneMetrics(pane, bar);
    }
  }

  function renderMetricsForBar(bar) {
    document.getElementById('hud-o').innerText = bar.open.toFixed(2);
    document.getElementById('hud-h').innerText = bar.high.toFixed(2);
    document.getElementById('hud-l').innerText = bar.low.toFixed(2);
    document.getElementById('hud-c').innerText = bar.close.toFixed(2);
    document.getElementById('hud-v').innerText = bar.volume.toLocaleString();

    const sig = document.getElementById('hud-signal');
    sig.innerText = bar.signalTag;
    sig.className = `px-1.5 py-0.5 rounded text-[10px] font-sans font-bold ${
      bar.signalTag === 'ACCUMULATION' ? 'bg-green-900/80 text-green-300' :
      bar.signalTag === 'DISTRIBUTION' ? 'bg-pink-900/80 text-pink-300' :
      bar.signalTag === 'CHURN' ? 'bg-blue-900/80 text-blue-300' : 'bg-gray-800 text-gray-400'
    }`;

    // Neon candle colors: ACCUMULATION rgba(156,245,39) / DISTRIBUTION rgba(245,39,156)
    const NEON_GREEN = '#9cf527';
    const NEON_PINK = '#f5279c';
    function setReturnColor(elId, val) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.innerText = val;
      const num = parseFloat(val);
      if (val === '--' || isNaN(num) || num === 0) {
        el.style.color = '';
        el.classList.remove('text-white');
        el.classList.add('text-gray-400');
      } else if (num > 0) {
        el.classList.remove('text-white', 'text-gray-400');
        el.style.color = NEON_GREEN;
      } else {
        el.classList.remove('text-white', 'text-gray-400');
        el.style.color = NEON_PINK;
      }
    }

  }

  function colorizeReturnEl(el, val) {
    if (!el) return;
    const num = parseFloat(val);
    const NEON_GREEN = '#9cf527';
    const NEON_PINK = '#f5279c';
    if (val === '--' || isNaN(num) || num === 0) {
      el.style.color = '';
    } else if (num > 0) {
      el.style.color = NEON_GREEN;
    } else {
      el.style.color = NEON_PINK;
    }
  }

  function renderPaneMetrics(pane, bar) {
    if (!pane || !bar) return;
    const root = document.getElementById('pane-' + pane.i + '-metrics');
    if (!root) return;
    const set = (key, val) => {
      const el = root.querySelector('[data-m="' + key + '"]');
      if (el) el.textContent = val;
    };
    if (pane.i === 0 || pane.i === 1) {
      set('atr', bar.atrPct + '%');
      set('chg', bar.chg);
      set('avgvol', bar.avgVolCur || '--');
      colorizeReturnEl(root.querySelector('[data-m="chg"]'), bar.chg);
    } else {
      set('ret1y', bar.ret1y);
      set('cagr3y', bar.cagr3y);
      set('cagr5y', bar.cagr5y);
      set('cagr7y', bar.cagr7y);
      set('cagr10y', bar.cagr10y);
      set('pivotDD', bar.pivotDD);
      set('athDD', bar.athDD);
      set('atr', bar.atrPct + '%');
      set('chg', bar.chg);
      set('avgvol', bar.avgVolCur || '--');
      ['ret1y','cagr3y','cagr5y','cagr7y','cagr10y','pivotDD','athDD','chg'].forEach(k => {
        colorizeReturnEl(root.querySelector('[data-m="' + k + '"]'), bar[k]);
      });
    }
  }

  // 4. DATA FETCHING ENGINE & YAHOO METADATA WATERMARK
  async function loadPaneData(pane, symbol, tfKey) {
    if (!pane) return;
    const tfConfig = TIMEFRAME_MAP[tfKey] || TIMEFRAME_MAP['1d'];
    const badge = document.getElementById('data-source-badge');

    try {
      const url = `${WORKER_URL}?symbol=${encodeURIComponent(symbol)}&range=${tfConfig.range}&interval=${tfConfig.interval}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Proxy error: ${response.statusText}`);

      const data = await response.json();
      const result = data.chart.result[0];
      const meta = result.meta || {};

      const returnedSymbol = meta.symbol || symbol;
      const shortName = meta.shortName || meta.longName || '';
      const returnedGranularity = meta.dataGranularity || meta.granularity || tfConfig.interval;
      const periodLabel = formatGranularityLabel(returnedGranularity);

      if (pane.i === 0) {
        const symbolDisplay = document.getElementById('symbol-display');
        if (symbolDisplay) symbolDisplay.innerText = returnedSymbol;
        const symbolName = document.getElementById('symbol-name');
        if (symbolName) symbolName.innerText = shortName || '--';
      }

      pane.priceChart.applyOptions({
        watermark: {
          visible: true,
          text: `${returnedSymbol} • ${periodLabel}`,
          color: 'rgba(255, 255, 255, 0.06)',
          fontSize: 48,
          horzAlign: 'center',
          vertAlign: 'center',
          fontFamily: 'sans-serif'
        }
      });

      const timestamps = result.timestamp || [];
      const quote = result.indicators.quote[0];

      const raw = [];
      const timestampMap = new Map();

      for (let i2 = 0; i2 < timestamps.length; i2++) {
        if (
          quote.open[i2] != null &&
          quote.high[i2] != null &&
          quote.low[i2] != null &&
          quote.close[i2] != null
        ) {
          const normalizedTime = normalizeTimestamp(timestamps[i2], tfKey);

          if (timestampMap.has(normalizedTime)) {
            const existingBar = timestampMap.get(normalizedTime);
            existingBar.high = Math.max(existingBar.high, quote.high[i2]);
            existingBar.low = Math.min(existingBar.low, quote.low[i2]);
            existingBar.close = quote.close[i2];
            existingBar.volume += (quote.volume[i2] || 0);
          } else {
            const newBar = {
              time: normalizedTime,
              open: quote.open[i2],
              high: quote.high[i2],
              low: quote.low[i2],
              close: quote.close[i2],
              volume: quote.volume[i2] || 0
            };
            timestampMap.set(normalizedTime, newBar);
            raw.push(newBar);
          }
        }
      }

      pane.chartData = calculatePineMetrics(raw, tfKey, symbol);

      pane.candleSeries.setData(pane.chartData.map(d => ({
        time: d.time,
        open: d.open,
        high: d.high,
        low: d.low,
        close: d.close,
        color: d.color,
        wickColor: d.wickColor,
        borderColor: d.borderColor
      })));

      pane.volumeSeries.setData(pane.chartData.map(d => ({
        time: d.time,
        value: d.volume,
        color: d.color
      })));

      const totalBars = pane.chartData.length;
      if (totalBars > 0) {
        let visibleCount = 63;
        if (tfKey === '1w') visibleCount = 52;
        if (tfKey === '1M') visibleCount = 60;
        if (tfKey === '3M') visibleCount = 40;

        const logicalRange = {
          from: totalBars - Math.min(totalBars, visibleCount),
          to: totalBars + 2
        };
        pane.priceChart.timeScale().setVisibleLogicalRange(logicalRange);
        pane.volumeChart.timeScale().setVisibleLogicalRange(logicalRange);
      }

      if (pane.chartData.length) {
        renderPaneMetrics(pane, pane.chartData[pane.chartData.length - 1]);
      }
      if (pane.i === 0 && pane.chartData.length) {
        renderMetricsForBar(pane.chartData[pane.chartData.length - 1]);
      }

      if (badge) {
        badge.innerText = '';
        badge.className = 'inline-block w-3 h-3 rounded-full bg-green-700 border border-green-500';
        badge.title = 'Proxy live';
      }
    } catch (err) {
      console.error("Error loading proxy data:", err);
      if (badge) {
        badge.innerText = '';
        badge.className = 'inline-block w-3 h-3 rounded-full bg-red-700 border border-red-500';
        badge.title = 'Fetch error';
      }
    }
  }

  async function loadAllPanes(symbol) {
    await Promise.all(panes.map(p => loadPaneData(p, symbol, p.tf)));
  }

  // 5. WATCHLIST ENGINE (Cloudflare D1-backed)
  let draggedItemId = null;

  function renderWatchlistSelector() {
    const select = document.getElementById('watchlist-select');
    if (!select) return;
    select.innerHTML = '';

    watchlists.forEach(wl => {
      const option = document.createElement('option');
      option.value = String(wl.id);
      option.innerText = wl.name;
      if (wl.id === activeWatchlistId) option.selected = true;
      select.appendChild(option);
    });
  }

  function renderActiveWatchlist() {
    const container = document.getElementById('watchlist-items');
    if (!container) return;
    container.innerHTML = '';

    const active = getActiveWatchlist();
    if (!active) {
      container.innerHTML = '<div class="p-3 text-xs text-gray-500">No watchlists yet. Create one with +.</div>';
      return;
    }
    const items = active.items || [];

    items.forEach((item) => {
      const div = document.createElement('div');
      div.setAttribute('draggable', 'true');
      div.setAttribute('data-id', String(item.id));

      if (item.type === 'section') {
        div.className = 'text-[11px] font-bold text-gray-400 pt-3 pb-1 px-2 border-b border-[#2a2e39] flex justify-between items-center cursor-grab active:cursor-grabbing transition-all border-t-2 border-t-transparent';
        const span = document.createElement('span');
        span.textContent = item.title || '';
        const btn = document.createElement('button');
        btn.className = 'text-gray-500 hover:text-red-400';
        btn.textContent = '×';
        btn.onclick = (e) => { e.stopPropagation(); removeWatchlistItem(item.id); };
        div.append(span, btn);
      } else {
        div.className = `p-2 rounded flex justify-between items-center cursor-grab active:cursor-grabbing hover:bg-[#2a2e39] transition-all border-t-2 border-t-transparent ${
          item.symbol === currentSymbol ? 'bg-[#2a2e39] border-l-2 border-l-blue-500' : ''
        }`;
        div.onclick = () => {
          currentSymbol = item.symbol;
          localStorage.setItem('quantview_symbol', currentSymbol);
          document.getElementById('symbol-display').innerText = item.symbol;
          loadAllPanes(currentSymbol);
          renderActiveWatchlist();
        };

        const wrap = document.createElement('div');
        wrap.className = 'pointer-events-none';
        const sym = document.createElement('div');
        sym.className = 'font-bold text-xs text-white';
        sym.textContent = item.symbol || '';
        wrap.appendChild(sym);
        const btn = document.createElement('button');
        btn.className = 'text-gray-500 hover:text-red-400 text-xs';
        btn.textContent = '×';
        btn.onclick = (e) => { e.stopPropagation(); removeWatchlistItem(item.id); };
        div.append(wrap, btn);
      }

      div.addEventListener('dragstart', (e) => {
        draggedItemId = item.id;
        e.dataTransfer.effectAllowed = 'move';
        div.classList.add('opacity-40');
      });

      div.addEventListener('dragend', () => {
        draggedItemId = null;
        div.classList.remove('opacity-40');
        clearDropIndicators();
      });

      div.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        clearDropIndicators();
        div.classList.add('border-t-blue-500');
      });

      div.addEventListener('dragleave', () => {
        div.classList.remove('border-t-blue-500');
      });

      div.addEventListener('drop', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        clearDropIndicators();

        const targetId = Number(div.getAttribute('data-id'));
        if (draggedItemId === null || draggedItemId === targetId) return;
        await moveWatchlistItem(draggedItemId, targetId);
      });

      container.appendChild(div);
    });
  }

  function clearDropIndicators() {
    const container = document.getElementById('watchlist-items');
    if (!container) return;
    Array.from(container.children).forEach(child => {
      child.classList.remove('border-t-blue-500');
    });
  }

  async function moveWatchlistItem(draggedId, targetId) {
    const active = getActiveWatchlist();
    if (!active) return;
    const ids = (active.items || []).map(i => i.id);
    const from = ids.indexOf(draggedId);
    const to = ids.indexOf(targetId);
    if (from < 0 || to < 0) return;
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    // Optimistic reorder
    active.items.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
    renderActiveWatchlist();
    try {
      await watchlistApi(`/watchlists/${active.id}/items/order`, 'PUT', { orderedIds: ids });
      await loadWatchlists();
    } catch (err) {
      console.error('Reorder failed:', err);
      await loadWatchlists();
    }
  }

  async function removeWatchlistItem(itemId) {
    const active = getActiveWatchlist();
    if (!active) return;
    try {
      await watchlistApi(`/watchlists/${active.id}/items/${itemId}`, 'DELETE');
      await loadWatchlists();
    } catch (err) {
      console.error('Delete item failed:', err);
      alert(`Could not delete symbol: ${err.message}`);
    }
  }
  // Exposed for any legacy inline handlers (now using addEventListener, kept for safety)
  window.removeWatchlistItem = removeWatchlistItem;

  async function moveActiveWatchlist(dir) {
    if (watchlists.length < 2) return;
    const idx = watchlists.findIndex(w => w.id === activeWatchlistId);
    if (idx < 0) return;
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= watchlists.length) return;
    const ordered = [...watchlists];
    const [moved] = ordered.splice(idx, 1);
    ordered.splice(newIdx, 0, moved);
    // Optimistic reorder
    watchlists = ordered;
    renderWatchlistSelector();
    try {
      await watchlistApi('/watchlists/order', 'PUT', { orderedIds: ordered.map(w => w.id) });
      await loadWatchlists();
    } catch (err) {
      console.error('Reorder watchlists failed:', err);
      await loadWatchlists();
    }
  }

  function setupWatchlistControls() {
    const select = document.getElementById('watchlist-select');
    const newBtn = document.getElementById('new-wl-btn');
    const upBtn = document.getElementById('move-wl-up-btn');
    const downBtn = document.getElementById('move-wl-down-btn');
    const renameBtn = document.getElementById('rename-wl-btn');
    const deleteBtn = document.getElementById('delete-wl-btn');

    if (select) {
      select.onchange = (e) => {
        activeWatchlistId = Number(e.target.value);
        saveActiveWatchlistId();
        renderActiveWatchlist();
      };
    }

    if (newBtn) {
      newBtn.onclick = async () => {
        const name = prompt("Enter new watchlist name:");
        if (name && name.trim()) {
          try {
            const created = await watchlistApi('/watchlists', 'POST', { name: name.trim() });
            activeWatchlistId = created.id;
            saveActiveWatchlistId();
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    if (upBtn) upBtn.onclick = () => moveActiveWatchlist(-1);
    if (downBtn) downBtn.onclick = () => moveActiveWatchlist(1);

    if (renameBtn) {
      renameBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const newName = prompt(`Rename watchlist "${active.name}" to:`, active.name);
        if (newName && newName.trim() && newName.trim() !== active.name) {
          try {
            await watchlistApi(`/watchlists/${active.id}`, 'PUT', { name: newName.trim() });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    if (deleteBtn) {
      deleteBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        if (watchlists.length <= 1) {
          alert("You must keep at least one watchlist.");
          return;
        }
        if (confirm(`Are you sure you want to delete the watchlist "${active.name}"?`)) {
          try {
            await watchlistApi(`/watchlists/${active.id}`, 'DELETE');
            activeWatchlistId = null;
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    const refreshScannerBtn = document.getElementById('refresh-scanner-btn');
    if (refreshScannerBtn) {
      refreshScannerBtn.onclick = async () => {
        try {
          const res = await fetch(`${WORKER_URL}/api/scanner/refresh`, { method: 'POST' });
          const data = await res.json();
          if (data.ok) {
            await loadWatchlists();
            alert('Watchlists refreshed from TradingView!');
          } else {
            alert('Refresh failed: ' + (data.error || 'unknown error'));
          }
        } catch (err) {
          console.error('Scanner refresh failed:', err);
          alert('Refresh failed: ' + err.message);
        }
      };
    }

    const copyWlBtn = document.getElementById('copy-wl-btn');
    if (copyWlBtn) {
      copyWlBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const EXCHANGE_SUFFIXES = new Set(['NS','BO','L','TO','AX','HK','T','SS','SZ','PA','DE','MI','SW','ST','OL','CO','HE','AS','BR','LS','MC','WA','AT','VI']);
        const stripExchange = (sym) => {
          const idx = sym.indexOf('.');
          if (idx < 0) return sym;
          const suffix = sym.slice(idx + 1).toUpperCase();
          if (EXCHANGE_SUFFIXES.has(suffix)) return sym.slice(0, idx);
          return sym;
        };
        const symbols = (active.items || []).filter(i => i.type === 'ticker').map(i => stripExchange(i.symbol));
        const tickers = symbols.join('\\r\\n');
        try {
          const html = '<table><tbody>' + symbols.map(s => '<tr><td>' + s + '</td></tr>').join('') + '</tbody></table>';
          if (window.ClipboardItem) {
            const item = new ClipboardItem({
              'text/plain': new Blob([tickers], { type: 'text/plain' }),
              'text/html': new Blob([html], { type: 'text/html' })
            });
            await navigator.clipboard.write([item]);
          } else {
            await navigator.clipboard.writeText(tickers);
          }
          alert('Copied ' + symbols.length + ' tickers to clipboard.');
        } catch (err) {
          console.error('Copy failed:', err);
          alert('Copy failed: ' + err.message);
        }
      };
    }

    const pasteWlBtn = document.getElementById('paste-wl-btn');
    if (pasteWlBtn) {
      pasteWlBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        let text = '';
        try { text = await navigator.clipboard.readText(); } catch (e) { text = ''; }
        if (!text) text = prompt('Paste ticker symbols (one per line or comma-separated):') || '';
        if (!text) return;
        const symbols = text.split(/[,\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
        if (!symbols.length) return;
        const suffixInput = prompt('Append exchange suffix to all? (e.g. .NS, .BO; leave blank for none)', '');
        const suffix = suffixInput ? (suffixInput.trim().startsWith('.') ? suffixInput.trim().toUpperCase() : '.' + suffixInput.trim().toUpperCase()) : '';
        const finalSymbols = symbols.map(s => (suffix && !s.includes('.') ? s + suffix : s));
        let added = 0;
        for (const sym of finalSymbols) {
          try {
            await watchlistApi(`/watchlists/${active.id}/items`, 'POST', { type: 'ticker', symbol: sym });
            added++;
          } catch (err) {
            console.error('Failed to add', sym, err);
          }
        }
        await loadWatchlists();
        alert('Added ' + added + ' of ' + finalSymbols.length + ' tickers.');
      };
    }

    const clearWlBtn = document.getElementById('clear-wl-btn');
    if (clearWlBtn) {
      clearWlBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const tickers = (active.items || []).filter(i => i.type === 'ticker');
        if (!tickers.length) { alert('No tickers to clear.'); return; }
        if (!confirm('Remove all ' + tickers.length + ' tickers from this watchlist?')) return;
        for (const item of tickers) {
          try {
            await watchlistApi(`/watchlists/${active.id}/items/${item.id}`, 'DELETE');
          } catch (err) {
            console.error('Failed to delete', item.id, err);
          }
        }
        await loadWatchlists();
      };
    }

    const addSectionBtn = document.getElementById('add-section-btn');
    if (addSectionBtn) {
      addSectionBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const title = prompt("Enter section header name:", "### NEW SECTION");
        if (title) {
          try {
            await watchlistApi(`/watchlists/${active.id}/items`, 'POST', { type: 'section', title });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    const addTickerBtn = document.getElementById('add-ticker-btn');
    if (addTickerBtn) {
      addTickerBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const sym = prompt("Enter Yahoo ticker symbol (e.g., AAPL, PH, TVSMOTOR.NS, BTC-USD):");
        if (sym && sym.trim()) {
          try {
            await watchlistApi(`/watchlists/${active.id}/items`, 'POST', { type: 'ticker', symbol: sym.trim() });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }
  }

  // Search functions

  function openSearch() {
    if (!searchResultsEl) return;
    searchResultsEl.classList.remove('hidden');
  }

  function closeSearch() {
    if (!searchResultsEl) return;
    searchResultsEl.classList.add('hidden');
    searchSelectedIndex = -1;
  }

  function renderSearchResults() {
    if (!searchResultsEl) return;
    if (!searchResults.length || !searchInput.value.trim()) {
      closeSearch();
      return;
    }
    openSearch();
    searchResultsEl.innerHTML = '';
    searchResults.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = `px-3 py-2 text-xs cursor-pointer hover:bg-[#2a2e39] ${idx === searchSelectedIndex ? 'bg-[#2a2e39] text-blue-400' : 'text-gray-300'}`;
      div.innerHTML = `
        <div class="font-bold">${escapeHtml(item.symbol)}</div>
        ${item.shortName ? `<div class="text-gray-500 truncate">${escapeHtml(item.shortName)}</div>` : ''}
        ${item.exchange ? `<div class="text-[10px] text-gray-600">${escapeHtml(item.exchange)}</div>` : ''}
      `;
      div.onclick = (e) => {
        e.stopPropagation();
        selectSearchResult(item);
      };
      searchResultsEl.appendChild(div);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function performSearch(query) {
    try {
      const res = await fetch(`${WORKER_URL}/api/search?q=${encodeURIComponent(query)}`);
      if (!res.ok) throw new Error(`Search failed: ${res.status}`);
      searchResults = await res.json();
    } catch (err) {
      console.error('Search error:', err);
      searchResults = [];
    }
    renderSearchResults();
  }

  function selectSearchResult(item) {
    currentSymbol = item.symbol;
    localStorage.setItem('quantview_symbol', currentSymbol);
    const symbolDisplay = document.getElementById('symbol-display');
    if (symbolDisplay) symbolDisplay.innerText = currentSymbol;
    if (searchInput) searchInput.value = '';
    closeSearch();
    loadAllPanes(currentSymbol);
  }

  function setupSearchControls() {
    searchInput = document.getElementById('symbol-search');
    searchResultsEl = document.getElementById('search-results');
    if (!searchInput || !searchResultsEl) return;

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      if (!q) {
        closeSearch();
        searchResults = [];
        return;
      }
      searchDebounceTimer = setTimeout(() => {
        performSearch(q);
      }, 300);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        searchSelectedIndex = Math.min(searchSelectedIndex + 1, searchResults.length - 1);
        renderSearchResults();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        searchSelectedIndex = Math.max(searchSelectedIndex - 1, -1);
        renderSearchResults();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (searchSelectedIndex >= 0 && searchResults[searchSelectedIndex]) {
          selectSearchResult(searchResults[searchSelectedIndex]);
        } else if (searchResults.length > 0) {
          selectSearchResult(searchResults[0]);
        } else {
          const sym = searchInput.value.trim().toUpperCase();
          if (sym) {
            currentSymbol = sym;
            localStorage.setItem('quantview_symbol', currentSymbol);
            const symbolDisplay = document.getElementById('symbol-display');
            if (symbolDisplay) symbolDisplay.innerText = currentSymbol;
            closeSearch();
            loadAllPanes(currentSymbol);
          }
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeSearch();
      }
    });

    document.addEventListener('click', (e) => {
      if (searchResultsEl && !searchResultsEl.contains(e.target) && e.target !== searchInput) {
        closeSearch();
      }
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    initAllCharts();
    setupWatchlistControls();
    setupSearchControls();

    const symbolDisplay = document.getElementById('symbol-display');
    if (symbolDisplay) symbolDisplay.innerText = currentSymbol;

    loadAllPanes(currentSymbol);
    try {
      await loadWatchlists();
    } catch {
      renderWatchlistSelector();
      renderActiveWatchlist();
    }

    // Auto-refresh scanner watchlists on page load
    try {
      const res = await fetch(`${WORKER_URL}/api/scanner/auto-refresh`);
      const data = await res.json();
      if (data.refreshed) {
        console.log('Scanner watchlists refreshed:', data.data);
        await loadWatchlists(); // reload watchlist selector
      }
    } catch (err) {
      console.error('Scanner auto-refresh failed:', err);
    }
  });
</script>
