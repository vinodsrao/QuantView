<!-- JavaScript Engine -->
<script>
  // 1. CONFIGURATION & PERSISTENT STATE
  // Auto-use local Worker when frontend is served from localhost.
  const WORKER_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:8787'
    : 'https://stock-proxy.vinodsrao.workers.dev';
  let currentSymbol = localStorage.getItem('quantview_symbol') || 'AAPL';
  let currentTimeframe = localStorage.getItem('quantview_tf') || '1d';
  let chartData = [];
  let priceChart, volumeChart, candleSeries, volumeSeries;

  const TIMEFRAME_MAP = {
    '1d': { range: '10y', interval: '1d', label: '1D' },
    '1w': { range: '10y', interval: '1wk', label: '1W' },
    '1M': { range: '10y', interval: '1mo', label: '1M' },
    '3M': { range: '10y', interval: '3mo', label: '3M' }
  };

  // RS benchmark cache: 2 markets x 4 timeframes = 8 entries, fetched once on load.
  // NSE:CNX500 (Nifty 500) -> Yahoo ^CRSLDX, SP:SPX -> Yahoo ^GSPC.
  const BENCHMARKS = { US: '^GSPC', IN: '^CRSLDX' };
  const benchCache = {}; // key `${market}_${tfKey}` -> { bars, byTime: Map }
  let benchPreloadStatus = 'idle'; // idle | loading | ready | partial | error

  function isIndiaSymbol(sym) {
    return /\.NS$|\.BO$/i.test(sym || '');
  }

  function marketForSymbol(sym) {
    return isIndiaSymbol(sym) ? 'IN' : 'US';
  }

  function benchKey(market, tfKey) {
    return `${market}_${tfKey}`;
  }

  function getCachedBenchmark(symbol, tfKey) {
    return benchCache[benchKey(marketForSymbol(symbol), tfKey)] || null;
  }

  // Shared Yahoo -> normalized bar parser (OHLC required, volume optional for indices).
  function parseYahooBars(result, tfKey) {
    const timestamps = result.timestamp || [];
    const quote = (result.indicators && result.indicators.quote && result.indicators.quote[0]) || {};
    const raw = [];
    const timestampMap = new Map();
    for (let i = 0; i < timestamps.length; i++) {
      if (quote.open[i] != null && quote.high[i] != null && quote.low[i] != null && quote.close[i] != null) {
        const normalizedTime = normalizeTimestamp(timestamps[i], tfKey);
        if (timestampMap.has(normalizedTime)) {
          const existingBar = timestampMap.get(normalizedTime);
          existingBar.high = Math.max(existingBar.high, quote.high[i]);
          existingBar.low = Math.min(existingBar.low, quote.low[i]);
          existingBar.close = quote.close[i];
          existingBar.volume += (quote.volume[i] || 0);
        } else {
          const newBar = {
            time: normalizedTime,
            open: quote.open[i],
            high: quote.high[i],
            low: quote.low[i],
            close: quote.close[i],
            volume: quote.volume[i] || 0
          };
          timestampMap.set(normalizedTime, newBar);
          raw.push(newBar);
        }
      }
    }
    return raw;
  }

  async function fetchBenchmark(market, tfKey) {
    const benchSymbol = BENCHMARKS[market];
    const tfConfig = TIMEFRAME_MAP[tfKey];
    const key = benchKey(market, tfKey);
    const url = `${WORKER_URL}?symbol=${encodeURIComponent(benchSymbol)}&range=${tfConfig.range}&interval=${tfConfig.interval}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Bench ${benchSymbol} ${tfKey}: ${response.statusText}`);
    const data = await response.json();
    const result = data.chart.result[0];
    const bars = parseYahooBars(result, tfKey);
    const byTime = new Map(bars.map(b => [b.time, b]));
    benchCache[key] = { symbol: benchSymbol, market, tfKey, bars, byTime };
    return benchCache[key];
  }

  // Fetch all 8 (2 benches x 4 TFs) once on load, in parallel. Non-blocking for main chart.
  async function preloadBenchmarks() {
    benchPreloadStatus = 'loading';
    const jobs = [];
    for (const market of Object.keys(BENCHMARKS)) {
      for (const tfKey of Object.keys(TIMEFRAME_MAP)) {
        jobs.push(
          fetchBenchmark(market, tfKey).catch(err => {
            console.warn('Benchmark preload failed:', benchKey(market, tfKey), err.message);
            return null;
          })
        );
      }
    }
    const results = await Promise.all(jobs);
    const ok = results.filter(Boolean).length;
    benchPreloadStatus = ok === 8 ? 'ready' : ok > 0 ? 'partial' : 'error';
    console.info(`Benchmark cache: ${ok}/8 loaded (${benchPreloadStatus})`);
    return benchCache;
  }

  // Watchlist contents live in Cloudflare D1 (server-side). Only UI prefs
  // (active id, symbol, timeframe) stay in localStorage.
  // Default seed is inserted by the Worker on first GET /api/watchlists.
  let watchlists = [];
  let activeWatchlistId = localStorage.getItem('quantview_active_watchlist_id')
    ? Number(localStorage.getItem('quantview_active_watchlist_id'))
    : null;
  let watchlistsLoading = false;

  function getActiveWatchlist() {
    return watchlists.find(w => w.id === activeWatchlistId) || watchlists[0] || null;
  }

  function saveActiveWatchlistId() {
    if (activeWatchlistId != null) {
      localStorage.setItem('quantview_active_watchlist_id', String(activeWatchlistId));
    }
  }

  async function watchlistApi(path, method = 'GET', body) {
    const res = await fetch(`${WORKER_URL}/api${path}`, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Watchlist API error (${res.status})`);
    return data;
  }

  async function loadWatchlists() {
    watchlistsLoading = true;
    try {
      watchlists = await watchlistApi('/watchlists', 'GET');
      if (!watchlists.length) throw new Error('No watchlists returned from server');
      if (!watchlists.some(w => w.id === activeWatchlistId)) {
        activeWatchlistId = watchlists[0].id;
        saveActiveWatchlistId();
      }
    } catch (err) {
      console.error('Failed to load watchlists from D1:', err);
      const container = document.getElementById('watchlist-items');
      if (container && !watchlists.length) {
        container.innerHTML = `<div class="p-3 text-xs text-red-400">Watchlist DB unavailable: ${err.message}<br/>Check Worker D1 binding + migrations.</div>`;
      }
      throw err;
    } finally {
      watchlistsLoading = false;
    }
    renderWatchlistSelector();
    renderActiveWatchlist();
  }

  // Universal Candle Normalization Across All Timeframes
  function normalizeTimestamp(timeInSeconds, timeframeKey) {
    const date = new Date((timeInSeconds + 43200) * 1000);
    const year = date.getUTCFullYear();
    const month = date.getUTCMonth();

    if (timeframeKey === '1w') {
      const day = date.getUTCDay();
      const diffToMonday = (day === 0 ? -6 : 1 - day);
      const monday = new Date(date);
      monday.setUTCDate(date.getUTCDate() + diffToMonday);
      return Math.floor(Date.UTC(monday.getUTCFullYear(), monday.getUTCMonth(), monday.getUTCDate()) / 1000);
    }

    if (timeframeKey === '1M') {
      return Math.floor(Date.UTC(year, month, 1) / 1000);
    }

    if (timeframeKey === '3M') {
      const quarterStartMonth = Math.floor(month / 3) * 3;
      return Math.floor(Date.UTC(year, quarterStartMonth, 1) / 1000);
    }

    return timeInSeconds;
  }

  function formatGranularityLabel(granularity) {
    if (!granularity) return '';
    const g = granularity.toLowerCase();
    if (g === '1d' || g === '1day') return '1D';
    if (g === '1wk' || g === '1week') return '1W';
    if (g === '1mo' || g === '1month') return '1M';
    if (g === '3mo' || g === '3month') return '3M';
    return g.toUpperCase();
  }

  // 2. PINE SCRIPT MATH ENGINE
  function dynamicLookback(timeframeKey) {
    if (timeframeKey === '1d') return 21;
    if (timeframeKey === '1w') return 52;
    if (timeframeKey === '1M') return 12;
    if (timeframeKey === '3M') return 4;
    return 21;
  }

  function calculatePineMetrics(data, zThreshold = 1.0) {
    const len = dynamicLookback(currentTimeframe);
    const volumes = data.map(d => d.volume);
    let runningAthPeak = 0;

    function findBarAtTime(targetTime) {
      if (!data.length || targetTime < data[0].time - (45 * 86400)) return null;
      let low = 0, high = data.length - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (data[mid].time < targetTime) {
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }
      let closest = low;
      if (low > 0 && (low >= data.length || Math.abs(data[low - 1].time - targetTime) < Math.abs(data[low].time - targetTime))) {
        closest = low - 1;
      }
      if (closest < 0 || closest >= data.length) return null;
      if (Math.abs(data[closest].time - targetTime) > 45 * 86400) return null;
      return data[closest];
    }

    return data.map((bar, i) => {
      const sliceVol = volumes.slice(Math.max(0, i - len + 1), i + 1);
      const avgVol = sliceVol.reduce((a, b) => a + b, 0) / sliceVol.length;
      const variance = sliceVol.reduce((a, b) => a + Math.pow(b - avgVol, 2), 0) / sliceVol.length;
      const stdVol = Math.sqrt(variance) || 0.0001;

      let trSum = 0;
      const start = Math.max(0, i - len + 1);
      for (let j = start; j <= i; j++) {
        const prevClose = j > 0 ? data[j - 1].close : data[j].open;
        const tr = Math.max(
          data[j].high - data[j].low,
          Math.abs(data[j].high - prevClose),
          Math.abs(data[j].low - prevClose)
        );
        trSum += tr;
      }
      const atr = trSum / (i - start + 1);

      const mintick = 0.0001;
      const zScore = (bar.volume - avgVol) / Math.max(stdVol, mintick);
      const vRatio = bar.volume / Math.max(avgVol, 1);
      const priceRange = Math.max(bar.high - bar.low, mintick);
      const clv = (bar.close - bar.low) / priceRange;
      const pChg = i > 0 ? bar.close - data[i - 1].close : 0;
      const pMoveInten = Math.abs(pChg) / Math.max(atr, mintick);

      const prevClose = i > 0 ? data[i - 1].close : bar.open;
      const isChurn = zScore > zThreshold && pMoveInten < 0.3;
      const isAccu = zScore > zThreshold && !isChurn && pChg > (-0.5 * atr) && ((bar.close > prevClose && clv > 0.4) || clv > 0.8);
      const isDist = zScore > zThreshold && !isChurn && (pChg < -atr || (bar.close < prevClose && clv < 0.6) || clv < 0.2);

      const decay = 1.0;
      const basePower = vRatio * pMoveInten * decay;
      const powerAccu = basePower * clv;
      const powerDist = basePower * (1 - clv);

      const accuTransp = Math.min(100, Math.max(0, 100 - Math.floor(powerAccu * 60)));
      const distTransp = Math.min(100, Math.max(0, 100 - Math.floor(powerDist * 60)));

      const accuAlpha = (100 - accuTransp) / 100;
      const distAlpha = (100 - distTransp) / 100;

      const isBullish = bar.close >= bar.open;
      let color = isBullish ? '#b2b5be' : '#4c525e';
      let wickColor = isBullish ? '#b2b5be' : '#848b9a';
      let borderColor = color;
      let signalTag = 'NEUTRAL';

      if (isChurn) {
        color = 'rgba(39, 156, 245, 0.7)';
        wickColor = 'rgba(39, 156, 245, 0.5)';
        borderColor = color;
        signalTag = 'CHURN';
      } else if (isAccu) {
        color = `rgba(156, 245, 39, ${accuAlpha.toFixed(2)})`;
        wickColor = 'rgba(156, 245, 39, 0.5)';
        borderColor = color;
        signalTag = 'ACCUMULATION';
      } else if (isDist) {
        color = `rgba(245, 39, 156, ${distAlpha.toFixed(2)})`;
        wickColor = 'rgba(245, 39, 156, 0.5)';
        borderColor = color;
        signalTag = 'DISTRIBUTION';
      }

      const bar1y = findBarAtTime(bar.time - (365.25 * 86400));
      const bar3y = findBarAtTime(bar.time - (3 * 365.25 * 86400));
      const bar5y = findBarAtTime(bar.time - (5 * 365.25 * 86400));
      const bar7y = findBarAtTime(bar.time - (7 * 365.25 * 86400));
      const bar10y = findBarAtTime(bar.time - (10 * 365.25 * 86400));

      const ret1y = bar1y ? (((bar.close - bar1y.close) / bar1y.close) * 100) : NaN;
      const cagr3y = bar3y ? ((Math.pow(bar.close / bar3y.close, 1 / 3) - 1) * 100) : NaN;
      const cagr5y = bar5y ? ((Math.pow(bar.close / bar5y.close, 1 / 5) - 1) * 100) : NaN;
      const cagr7y = bar7y ? ((Math.pow(bar.close / bar7y.close, 1 / 7) - 1) * 100) : NaN;
      const cagr10y = bar10y ? ((Math.pow(bar.close / bar10y.close, 1 / 10) - 1) * 100) : NaN;

      runningAthPeak = Math.max(runningAthPeak, bar.high);
      const athDD = runningAthPeak > 0 ? ((bar.close - runningAthPeak) / runningAthPeak) * 100 : 0;

      const pivotStart = Math.max(0, i - 50);
      let pivotPeak = 0;
      for (let p = pivotStart; p <= i; p++) {
        if (data[p].high > pivotPeak) pivotPeak = data[p].high;
      }
      const pivotDD = pivotPeak > 0 ? ((bar.close - pivotPeak) / pivotPeak) * 100 : 0;

      const prevCloseForChg = i > 0 ? data[i - 1].close : null;
      const chg = prevCloseForChg ? ((bar.close - prevCloseForChg) / prevCloseForChg) * 100 : NaN;

      return {
        ...bar,
        color,
        wickColor,
        borderColor,
        signalTag,
        atrPct: ((atr / bar.close) * 100).toFixed(2),
        chg: isNaN(chg) ? '--' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%',
        ret1y: isNaN(ret1y) ? '--' : ret1y.toFixed(1) + '%',
        cagr3y: isNaN(cagr3y) ? '--' : cagr3y.toFixed(1) + '%',
        cagr5y: isNaN(cagr5y) ? '--' : cagr5y.toFixed(1) + '%',
        cagr7y: isNaN(cagr7y) ? '--' : cagr7y.toFixed(1) + '%',
        cagr10y: isNaN(cagr10y) ? '--' : cagr10y.toFixed(1) + '%',
        pivotDD: pivotDD.toFixed(1) + '%',
        athDD: athDD.toFixed(1) + '%'
      };
    });
  }

  // 2b. RS ENGINE — port of Pine v6 'RS Candles With Accum Dist Log Scale' (overlay=false)
  const RS_SETTINGS = {
    zThreshold: 1.0,
    showCurrLine: localStorage.getItem('quantview_rs_cur') !== '0',
    showLookback: localStorage.getItem('quantview_rs_lb') === '1',
    showEma1: localStorage.getItem('quantview_rs_ema1') === '1',
    showEma2: localStorage.getItem('quantview_rs_ema2') === '1',
    showEma3: localStorage.getItem('quantview_rs_ema3') === '1',
  };
  let rsData = [];
  let lastRaw = [];
  let rsLookbackLen = 21;

  // Pine dynamicLookback() triplets. App TFs: 1d=daily, 1w=weekly, 1M=monthly, 3M=quarterly(4).
  function rsLookbackTriple(tfKey) {
    if (tfKey === '1d') return [21, 63, 252];
    if (tfKey === '1w') return [0, 13, 52];
    if (tfKey === '1M') return [0, 0, 12];
    if (tfKey === '3M') return [0, 0, 4];
    return [21, 63, 252];
  }

  function emaArray(src, len) {
    const out = new Array(src.length).fill(null);
    if (!(len > 0) || !src.length) return out;
    const alpha = 2 / (len + 1);
    let prev = src[0];
    out[0] = prev;
    for (let i = 1; i < src.length; i++) {
      if (src[i] == null) { out[i] = prev; continue; }
      prev = alpha * src[i] + (1 - alpha) * prev;
      out[i] = prev;
    }
    return out;
  }

  // Pine ta.atr(len) = RMA(TR). Seed with SMA of first len TRs, then Wilder smoothing.
  function atrRmaArray(bars, len) {
    const out = new Array(bars.length).fill(0);
    if (!(len > 0) || !bars.length) return out;
    const trs = bars.map((b, i) => {
      const prevClose = i > 0 ? bars[i - 1].close : b.open;
      return Math.max(b.high - b.low, Math.abs(b.high - prevClose), Math.abs(b.low - prevClose));
    });
    let acc = 0;
    for (let i = 0; i < bars.length; i++) {
      if (i < len) {
        acc += trs[i];
        out[i] = acc / (i + 1);
      } else if (i === len) {
        acc += trs[i];
        out[i] = acc / len;
      } else {
        out[i] = (out[i - 1] * (len - 1) + trs[i]) / len;
      }
    }
    return out;
  }

  function findBenchAtOrBefore(benchBars, targetTime) {
    if (!benchBars.length) return null;
    let lo = 0, hi = benchBars.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (benchBars[mid].time <= targetTime) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans >= 0 ? benchBars[ans] : null;
  }

  function calculateRS(mainBars, benchEntry, tfKey) {
    const [lb1, lb2, lb3] = rsLookbackTriple(tfKey);
    const len = lb1 > 0 ? lb1 : (lb2 > 0 ? lb2 : (lb3 > 0 ? lb3 : 21));
    rsLookbackLen = lb1 > 0 ? lb1 : len;
    const mintick = 0.0001;
    const zThreshold = RS_SETTINGS.zThreshold;
    const benchBars = (benchEntry && benchEntry.bars) || [];
    const benchByTime = (benchEntry && benchEntry.byTime) || new Map();

    const volumes = mainBars.map(d => d.volume || 0);
    const atrArr = atrRmaArray(mainBars, len);

    const pctCList = [];
    let cumRs = 0;
    const rows = [];

    for (let i = 0; i < mainBars.length; i++) {
      const bar = mainBars[i];
      // --- Accum/Dist power (same rules as price pane) ---
      const s = Math.max(0, i - len + 1);
      const sliceVol = volumes.slice(s, i + 1);
      const avgVol = sliceVol.reduce((a, b) => a + b, 0) / sliceVol.length;
      let variance = 0;
      for (const v of sliceVol) variance += (v - avgVol) * (v - avgVol);
      variance /= sliceVol.length;
      const stdVol = Math.sqrt(variance) || 0.0001;
      const atr = atrArr[i] || mintick;

      const priceRange = Math.max(bar.high - bar.low, mintick);
      const clv = (bar.close - bar.low) / priceRange;
      const prevCloseMain = i > 0 ? mainBars[i - 1].close : bar.open;
      const pChg = i > 0 ? bar.close - mainBars[i - 1].close : 0;
      const pMoveInten = Math.abs(pChg) / Math.max(atr, mintick);
      const zScore = (bar.volume - avgVol) / Math.max(stdVol, mintick);
      const vRatio = bar.volume / Math.max(avgVol, 1);
      const isChurn = zScore > zThreshold && pMoveInten < 0.3;
      const isAccu = zScore > zThreshold && !isChurn && pChg > (-0.5 * atr) && ((bar.close > prevCloseMain && clv > 0.4) || clv > 0.8);
      const isDist = zScore > zThreshold && !isChurn && (pChg < -atr || (bar.close < prevCloseMain && clv < 0.6) || clv < 0.2);
      const powerAccu = vRatio * clv * pMoveInten;
      const powerDist = vRatio * (1 - clv) * pMoveInten;
      const accuTransp = Math.min(100, Math.max(0, 100 - Math.floor(powerAccu * 60)));
      const distTransp = Math.min(100, Math.max(0, 100 - Math.floor(powerDist * 60)));

      // --- Log RS vs benchmark (request.security same TF) ---
      const bNow = benchByTime.get(bar.time) || findBenchAtOrBefore(benchBars, bar.time);
      const prevMain = i > 0 ? mainBars[i - 1] : null;
      const bPrev = prevMain ? (benchByTime.get(prevMain.time) || findBenchAtOrBefore(benchBars, prevMain.time)) : null;

      let pct_o = null, pct_h = null, pct_l = null, pct_c = null;
      if (i === 0 || !bNow || !bPrev || !prevMain) {
        // Seed first bar at 0 (Pine nz(cum[1],0) equivalent)
        if (i === 0) { cumRs = 0; pct_o = 0; pct_h = 0; pct_l = 0; pct_c = 0; }
      } else if (bar.open > 0 && bar.high > 0 && bar.low > 0 && bar.close > 0 && prevMain.close > 0 &&
                 bNow.open > 0 && bNow.high > 0 && bNow.low > 0 && bNow.close > 0 && bPrev.close > 0) {
        const daily_o = (Math.log(bar.open) - Math.log(prevMain.close)) - (Math.log(bNow.open) - Math.log(bPrev.close));
        const daily_c = (Math.log(bar.close) - Math.log(prevMain.close)) - (Math.log(bNow.close) - Math.log(bPrev.close));
        const intra_h = (Math.log(bar.high) - Math.log(bar.open)) - (Math.log(bNow.high) - Math.log(bNow.open));
        const intra_l = (Math.log(bar.low) - Math.log(bar.open)) - (Math.log(bNow.low) - Math.log(bNow.open));
        const prevCum = cumRs;
        cumRs += daily_c;
        pct_o = (prevCum + daily_o) * 100;
        pct_c = cumRs * 100;
        pct_h = Math.max(pct_o, pct_c, (prevCum + daily_o + intra_h) * 100);
        pct_l = Math.min(pct_o, pct_c, (prevCum + daily_o + intra_l) * 100);
      }
      // Carry forward last cum when bench missing (holiday mismatch) to avoid gaps
      if (pct_c == null) {
        const last = pctCList.length ? pctCList[pctCList.length - 1] : 0;
        pct_o = last; pct_h = last; pct_l = last; pct_c = last;
      }
      pctCList.push(pct_c);
      rows.push({ time: bar.time, open: pct_o, high: pct_h, low: pct_l, close: pct_c, isChurn, isAccu, isDist, accuTransp, distTransp });
    }

    // EMAs of pct_rs_c (Pine: na when lookback==0)
    const ema1Arr = lb1 > 0 ? emaArray(pctCList, lb1) : new Array(rows.length).fill(null);
    const ema2Arr = lb2 > 0 ? emaArray(pctCList, lb2) : new Array(rows.length).fill(null);
    const ema3Arr = lb3 > 0 ? emaArray(pctCList, lb3) : new Array(rows.length).fill(null);

    return rows.map((r, i) => {
      const isBull = r.close >= r.open;
      let color = isBull ? '#b2b5be' : '#4c525e';
      let wickColor = isBull ? '#b2b5be' : '#848b9a';
      let signalTag = 'NEUTRAL';
      if (r.isChurn) { color = 'rgba(39, 156, 245, 0.7)'; wickColor = 'rgba(39, 156, 245, 0.5)'; signalTag = 'CHURN'; }
      else if (r.isAccu) { const a = ((100 - r.accuTransp) / 100).toFixed(2); color = `rgba(156, 245, 39, ${a})`; wickColor = 'rgba(156, 245, 39, 0.5)'; signalTag = 'ACCUMULATION'; }
      else if (r.isDist) { const a = ((100 - r.distTransp) / 100).toFixed(2); color = `rgba(245, 39, 156, ${a})`; wickColor = 'rgba(245, 39, 156, 0.5)'; signalTag = 'DISTRIBUTION'; }
      const prevC = i > 0 ? pctCList[i - 1] : r.close;
      const chg = prevC !== 0 ? ((r.close - prevC) / Math.abs(prevC)) * 100 : 0;
      return { ...r, borderColor: color, color, wickColor, signalTag, rsPct: chg, ema1: ema1Arr[i], ema2: ema2Arr[i], ema3: ema3Arr[i] };
    });
  }

  let rsChart, rsCandleSeries, rsEma1Series, rsEma2Series, rsEma3Series, rsPriceLine = null;
  let isSyncingRange = false;

  // 3. CHART INITIALIZATION
  function initCharts() {
    const priceContainer = document.getElementById('price-chart-container');
    const volumeContainer = document.getElementById('volume-chart-container');
    const rsContainer = document.getElementById('rs-chart-container');

    if (!priceContainer || !volumeContainer) return;

    const pHeight = priceContainer.clientHeight || 400;
    const vHeight = volumeContainer.clientHeight || 128;
    const rsHeight = (rsContainer && rsContainer.clientHeight) || 160;

    priceChart = LightweightCharts.createChart(priceContainer, {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
      timeScale: { rightOffset: 5, barSpacing: 10 },
      height: pHeight,
      rightPriceScale: { minimumWidth: 75, mode: 1 },
      watermark: {
        visible: true,
        fontSize: 100,
        horzAlign: 'center',
        vertAlign: 'center',
        color: 'rgba(255, 255, 255, 0.06)',
        text: currentSymbol + ' • ' + (TIMEFRAME_MAP[currentTimeframe]?.label || '1D'),
        fontFamily: 'sans-serif'
      }
    });

    volumeChart = LightweightCharts.createChart(volumeContainer, {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
      timeScale: { rightOffset: 5, barSpacing: 10 },
      height: vHeight,
      rightPriceScale: { minimumWidth: 75, mode: 0 }
    });

    candleSeries = priceChart.addCandlestickSeries();
    volumeSeries = volumeChart.addHistogramSeries({ priceFormat: { type: 'volume' } });

    if (rsContainer) {
      rsChart = LightweightCharts.createChart(rsContainer, {
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
        timeScale: { rightOffset: 5, barSpacing: 10 },
        height: rsHeight,
        rightPriceScale: { minimumWidth: 75, mode: 1 },
      });
      rsCandleSeries = rsChart.addCandlestickSeries({ priceLineVisible: false });
      rsEma1Series = rsChart.addLineSeries({ color: 'rgba(255, 191, 0, 0.3)', lineWidth: 1, lineStyle: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      rsEma2Series = rsChart.addLineSeries({ color: 'rgba(255, 191, 0, 0.4)', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      rsEma3Series = rsChart.addLineSeries({ color: 'rgba(255, 49, 49, 0.2)', lineWidth: 1, lineStyle: 0, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    }

    function syncRange(source, targets, range) {
      if (!range || isSyncingRange) return;
      isSyncingRange = true;
      try { targets.forEach(t => { try { t.timeScale().setVisibleLogicalRange(range); } catch {} }); }
      finally { isSyncingRange = false; }
    }

    priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      const targets = [volumeChart, rsChart].filter(Boolean);
      syncRange(priceChart, targets, range);
    });
    volumeChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      const targets = [priceChart, rsChart].filter(Boolean);
      syncRange(volumeChart, targets, range);
    });
    if (rsChart) {
      rsChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
        syncRange(rsChart, [priceChart, volumeChart], range);
      });
    }

    window.addEventListener('resize', () => {
      const w = priceContainer.clientWidth;
      if (w > 0) {
        priceChart.applyOptions({ width: w });
        volumeChart.applyOptions({ width: w });
        if (rsChart) rsChart.applyOptions({ width: w });
      }
    });

    priceChart.subscribeCrosshairMove(param => updateStatusBar(param));
    volumeChart.subscribeCrosshairMove(param => updateStatusBar(param));
    if (rsChart) rsChart.subscribeCrosshairMove(param => updateStatusBar(param));

    setupTimeframeListeners();
    setupRSControls();
  }

  function setupRSControls() {
    const map = [['rs-ema1', 'showEma1', 'quantview_rs_ema1'], ['rs-ema2', 'showEma2', 'quantview_rs_ema2'], ['rs-ema3', 'showEma3', 'quantview_rs_ema3'], ['rs-cur', 'showCurrLine', 'quantview_rs_cur'], ['rs-lb', 'showLookback', 'quantview_rs_lb']];
    map.forEach(([id, key, ls]) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.checked = !!RS_SETTINGS[key];
      el.onchange = () => {
        RS_SETTINGS[key] = el.checked;
        localStorage.setItem(ls, el.checked ? '1' : '0');
        refreshRSPane();
      };
    });
  }

  function setupTimeframeListeners() {
    const buttons = document.querySelectorAll('.tf-btn');

    buttons.forEach(btn => {
      const tf = btn.getAttribute('data-tf');
      if (tf === currentTimeframe) {
        btn.classList.add('bg-[#2a2e39]', 'text-blue-400');
        btn.classList.remove('text-gray-400');
      } else {
        btn.classList.remove('bg-[#2a2e39]', 'text-blue-400');
        btn.classList.add('text-gray-400');
      }

      btn.addEventListener('click', (e) => {
        buttons.forEach(b => {
          b.classList.remove('bg-[#2a2e39]', 'text-blue-400');
          b.classList.add('text-gray-400');
        });

        e.target.classList.add('bg-[#2a2e39]', 'text-blue-400');
        e.target.classList.remove('text-gray-400');

        currentTimeframe = e.target.getAttribute('data-tf');
        localStorage.setItem('quantview_tf', currentTimeframe);

        loadData(currentSymbol, currentTimeframe);
      });
    });
  }

  function updateStatusBar(param) {
    if (!param || !param.time || !chartData.length) {
      if (chartData.length) renderMetricsForBar(chartData[chartData.length - 1]);
      if (rsData.length) renderRSForBar(rsData[rsData.length - 1]);
      return;
    }
    const bar = chartData.find(d => d.time === param.time);
    if (bar) renderMetricsForBar(bar);
    const rsBar = rsData.find(d => d.time === param.time);
    if (rsBar) renderRSForBar(rsBar);
  }

  function renderRSForBar(rsBar) {
    const set = (id, v) => { const el = document.getElementById(id); if (el && rsBar) el.innerText = v; };
    if (!rsBar) return;
    set('rs-o', rsBar.open.toFixed(2));
    set('rs-h', rsBar.high.toFixed(2));
    set('rs-l', rsBar.low.toFixed(2));
    set('rs-c', rsBar.close.toFixed(2));
    const chgEl = document.getElementById('rs-chg');
    if (chgEl) {
      const v = rsBar.rsPct;
      chgEl.innerText = (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
      chgEl.style.color = v > 0 ? '#9cf527' : v < 0 ? '#f5279c' : '#d1d4dc';
    }
    const emaEl = document.getElementById('rs-ema-legend');
    if (emaEl) {
      const parts = [];
      if (RS_SETTINGS.showEma1 && rsBar.ema1 != null) parts.push(`EMA-S:${rsBar.ema1.toFixed(2)}`);
      if (RS_SETTINGS.showEma2 && rsBar.ema2 != null) parts.push(`EMA-M:${rsBar.ema2.toFixed(2)}`);
      if (RS_SETTINGS.showEma3 && rsBar.ema3 != null) parts.push(`EMA-L:${rsBar.ema3.toFixed(2)}`);
      emaEl.innerText = parts.join('  ');
    }
  }

  function renderMetricsForBar(bar) {
    document.getElementById('hud-o').innerText = bar.open.toFixed(2);
    document.getElementById('hud-h').innerText = bar.high.toFixed(2);
    document.getElementById('hud-l').innerText = bar.low.toFixed(2);
    document.getElementById('hud-c').innerText = bar.close.toFixed(2);
    document.getElementById('hud-v').innerText = bar.volume.toLocaleString();

    const sig = document.getElementById('hud-signal');
    sig.innerText = bar.signalTag;
    sig.className = `px-1.5 py-0.5 rounded text-[10px] font-sans font-bold ${
      bar.signalTag === 'ACCUMULATION' ? 'bg-green-900/80 text-green-300' :
      bar.signalTag === 'DISTRIBUTION' ? 'bg-pink-900/80 text-pink-300' :
      bar.signalTag === 'CHURN' ? 'bg-blue-900/80 text-blue-300' : 'bg-gray-800 text-gray-400'
    }`;

    // Neon candle colors: ACCUMULATION rgba(156,245,39) / DISTRIBUTION rgba(245,39,156)
    const NEON_GREEN = '#9cf527';
    const NEON_PINK = '#f5279c';
    function setReturnColor(elId, val) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.innerText = val;
      const num = parseFloat(val);
      if (val === '--' || isNaN(num) || num === 0) {
        el.style.color = '';
        el.classList.remove('text-white');
        el.classList.add('text-gray-400');
      } else if (num > 0) {
        el.classList.remove('text-white', 'text-gray-400');
        el.style.color = NEON_GREEN;
      } else {
        el.classList.remove('text-white', 'text-gray-400');
        el.style.color = NEON_PINK;
      }
    }

    setReturnColor('m-1y', bar.ret1y);
    setReturnColor('m-3y', bar.cagr3y);
    setReturnColor('m-5y', bar.cagr5y);
    setReturnColor('m-7y', bar.cagr7y);
    setReturnColor('m-10y', bar.cagr10y);
    setReturnColor('m-pdd', bar.pivotDD);
    setReturnColor('m-athdd', bar.athDD);
    document.getElementById('m-atr').innerText = bar.atrPct + '%';
    setReturnColor('m-chg', bar.chg || '--');
  }

  // 4. DATA FETCHING ENGINE & YAHOO METADATA WATERMARK
  async function refreshRSPane() {
    if (!rsCandleSeries || !lastRaw.length) return;
    let bench = getCachedBenchmark(currentSymbol, currentTimeframe);
    if (!bench) {
      // On-demand fallback when preload missed (e.g. first paint race). Then cache for session.
      try { bench = await fetchBenchmark(marketForSymbol(currentSymbol), currentTimeframe); }
      catch (e) { console.warn('RS bench on-demand fetch failed:', e.message); return; }
    }
    const benchEl = document.getElementById('rs-bench');
    if (benchEl) benchEl.innerText = `vs ${bench.symbol}`;
    rsData = calculateRS(lastRaw, bench, currentTimeframe);
    rsCandleSeries.setData(rsData.map(d => ({
      time: d.time, open: d.open, high: d.high, low: d.low, close: d.close,
      color: d.color, wickColor: d.wickColor, borderColor: d.borderColor
    })));
    const filt = (key, flag) => RS_SETTINGS[flag]
      ? rsData.filter(d => d[key] != null).map(d => ({ time: d.time, value: d[key] }))
      : [];
    rsEma1Series.setData(filt('ema1', 'showEma1'));
    rsEma2Series.setData(filt('ema2', 'showEma2'));
    rsEma3Series.setData(filt('ema3', 'showEma3'));

    // Current RS value line (Pine: show_curr_line, dotted both-extend) -> Lightweight price line
    if (rsPriceLine) { try { rsCandleSeries.removePriceLine(rsPriceLine); } catch {} rsPriceLine = null; }
    if (RS_SETTINGS.showCurrLine && rsData.length) {
      const last = rsData[rsData.length - 1];
      rsPriceLine = rsCandleSeries.createPriceLine({
        price: last.close, color: 'rgba(178,181,190,0.6)', lineWidth: 1, lineStyle: 2,
        axisLabelVisible: true, title: 'RS'
      });
    }
    // Lookback start triangle (Pine: offset=-(lookback-1), location.bottom)
    if (RS_SETTINGS.showLookback && rsData.length && rsLookbackLen > 1) {
      const idx = rsData.length - rsLookbackLen;
      if (idx >= 0) {
        rsCandleSeries.setMarkers([{ time: rsData[idx].time, position: 'belowBar', color: '#ffeb3b', shape: 'arrowUp', text: 'LB' }]);
      } else rsCandleSeries.setMarkers([]);
    } else {
      try { rsCandleSeries.setMarkers([]); } catch {}
    }
    renderRSForBar(rsData[rsData.length - 1]);
    // Keep RS viewport aligned with price pane
    try {
      const range = priceChart.timeScale().getVisibleLogicalRange();
      if (range) rsChart.timeScale().setVisibleLogicalRange(range);
    } catch {}
  }

  async function loadData(symbol, tfKey = '1d') {
    const tfConfig = TIMEFRAME_MAP[tfKey] || TIMEFRAME_MAP['1d'];
    const badge = document.getElementById('data-source-badge');
    const symbolDisplayPre = document.getElementById('symbol-display');
    if (symbolDisplayPre) symbolDisplayPre.innerText = symbol;
    const symbolNamePre = document.getElementById('symbol-name');
    if (symbolNamePre) symbolNamePre.innerText = '…';
    if (badge) {
      badge.innerText = 'PROXY FETCHING...';
      badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-amber-900/50 text-amber-400 border border-amber-700/50 font-mono';
    }

    try {
      const url = `${WORKER_URL}?symbol=${encodeURIComponent(symbol)}&range=${tfConfig.range}&interval=${tfConfig.interval}`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Proxy error: ${response.statusText}`);
      }

      const data = await response.json();
      const result = data.chart.result[0];
      const meta = result.meta || {};

      const returnedSymbol = meta.symbol || symbol;
      const shortName = meta.shortName || meta.longName || '';
      const returnedGranularity = meta.dataGranularity || meta.granularity || tfConfig.interval;
      const periodLabel = formatGranularityLabel(returnedGranularity);

      const symbolDisplay = document.getElementById('symbol-display');
      if (symbolDisplay) symbolDisplay.innerText = returnedSymbol;
      const symbolName = document.getElementById('symbol-name');
      if (symbolName) symbolName.innerText = shortName || '--';

      if (priceChart) {
        priceChart.applyOptions({
          watermark: {
            visible: true,
            text: `${returnedSymbol} • ${periodLabel}`,
            color: 'rgba(255, 255, 255, 0.06)',
            fontSize: 100,
            horzAlign: 'center',
            vertAlign: 'center',
            fontFamily: 'sans-serif'
          }
        });
      }

      const raw = parseYahooBars(result, tfKey);
      lastRaw = raw;

      chartData = calculatePineMetrics(raw);

      candleSeries.setData(chartData.map(d => ({
        time: d.time,
        open: d.open,
        high: d.high,
        low: d.low,
        close: d.close,
        color: d.color,
        wickColor: d.wickColor,
        borderColor: d.borderColor
      })));

      volumeSeries.setData(chartData.map(d => ({
        time: d.time,
        value: d.volume,
        color: d.color
      })));

      const totalBars = chartData.length;
      if (totalBars > 0) {
        let visibleCount = 120;
        if (tfKey === '1w') visibleCount = 52;
        if (tfKey === '1M') visibleCount = 48;
        if (tfKey === '3M') visibleCount = 20;

        const logicalRange = {
          from: totalBars - Math.min(totalBars, visibleCount),
          to: totalBars + 2
        };
        priceChart.timeScale().setVisibleLogicalRange(logicalRange);
        volumeChart.timeScale().setVisibleLogicalRange(logicalRange);
        if (rsChart) { try { rsChart.timeScale().setVisibleLogicalRange(logicalRange); } catch {} }
      }

      renderMetricsForBar(chartData[chartData.length - 1]);
      // RS pane uses cached bench (no extra fetch in steady state)
      refreshRSPane();

      if (badge) {
        badge.innerText = 'PROXY LIVE';
        badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-green-900/50 text-green-400 border border-green-700/50 font-mono';
      }
    } catch (err) {
      console.error("Error loading proxy data:", err);
      if (badge) {
        badge.innerText = 'FETCH ERROR';
        badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-red-900/50 text-red-400 border border-red-700/50 font-mono';
      }
    }
  }

  // 5. WATCHLIST ENGINE (Cloudflare D1-backed)
  let draggedItemId = null;

  function renderWatchlistSelector() {
    const select = document.getElementById('watchlist-select');
    if (!select) return;
    select.innerHTML = '';

    watchlists.forEach(wl => {
      const option = document.createElement('option');
      option.value = String(wl.id);
      option.innerText = wl.name;
      if (wl.id === activeWatchlistId) option.selected = true;
      select.appendChild(option);
    });
  }

  function renderActiveWatchlist() {
    const container = document.getElementById('watchlist-items');
    if (!container) return;
    container.innerHTML = '';

    const active = getActiveWatchlist();
    if (!active) {
      container.innerHTML = '<div class="p-3 text-xs text-gray-500">No watchlists yet. Create one with +.</div>';
      return;
    }
    const items = active.items || [];

    items.forEach((item) => {
      const div = document.createElement('div');
      div.setAttribute('draggable', 'true');
      div.setAttribute('data-id', String(item.id));

      if (item.type === 'section') {
        div.className = 'text-[11px] font-bold text-gray-400 pt-3 pb-1 px-2 border-b border-[#2a2e39] flex justify-between items-center cursor-grab active:cursor-grabbing transition-all border-t-2 border-t-transparent';
        const span = document.createElement('span');
        span.textContent = item.title || '';
        const btn = document.createElement('button');
        btn.className = 'text-gray-500 hover:text-red-400';
        btn.textContent = '×';
        btn.onclick = (e) => { e.stopPropagation(); removeWatchlistItem(item.id); };
        div.append(span, btn);
      } else {
        div.className = `p-2 rounded flex justify-between items-center cursor-grab active:cursor-grabbing hover:bg-[#2a2e39] transition-all border-t-2 border-t-transparent ${
          item.symbol === currentSymbol ? 'bg-[#2a2e39] border-l-2 border-l-blue-500' : ''
        }`;
        div.onclick = () => {
          currentSymbol = item.symbol;
          localStorage.setItem('quantview_symbol', currentSymbol);
          document.getElementById('symbol-display').innerText = item.symbol;
          loadData(item.symbol, currentTimeframe);
          renderActiveWatchlist();
        };

        const wrap = document.createElement('div');
        wrap.className = 'pointer-events-none';
        const sym = document.createElement('div');
        sym.className = 'font-bold text-xs text-white';
        sym.textContent = item.symbol || '';
        wrap.appendChild(sym);
        const btn = document.createElement('button');
        btn.className = 'text-gray-500 hover:text-red-400 text-xs';
        btn.textContent = '×';
        btn.onclick = (e) => { e.stopPropagation(); removeWatchlistItem(item.id); };
        div.append(wrap, btn);
      }

      div.addEventListener('dragstart', (e) => {
        draggedItemId = item.id;
        e.dataTransfer.effectAllowed = 'move';
        div.classList.add('opacity-40');
      });

      div.addEventListener('dragend', () => {
        draggedItemId = null;
        div.classList.remove('opacity-40');
        clearDropIndicators();
      });

      div.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        clearDropIndicators();
        div.classList.add('border-t-blue-500');
      });

      div.addEventListener('dragleave', () => {
        div.classList.remove('border-t-blue-500');
      });

      div.addEventListener('drop', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        clearDropIndicators();

        const targetId = Number(div.getAttribute('data-id'));
        if (draggedItemId === null || draggedItemId === targetId) return;
        await moveWatchlistItem(draggedItemId, targetId);
      });

      container.appendChild(div);
    });
  }

  function clearDropIndicators() {
    const container = document.getElementById('watchlist-items');
    if (!container) return;
    Array.from(container.children).forEach(child => {
      child.classList.remove('border-t-blue-500');
    });
  }

  async function moveWatchlistItem(draggedId, targetId) {
    const active = getActiveWatchlist();
    if (!active) return;
    const ids = (active.items || []).map(i => i.id);
    const from = ids.indexOf(draggedId);
    const to = ids.indexOf(targetId);
    if (from < 0 || to < 0) return;
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    // Optimistic reorder
    active.items.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
    renderActiveWatchlist();
    try {
      await watchlistApi(`/watchlists/${active.id}/items/order`, 'PUT', { orderedIds: ids });
      await loadWatchlists();
    } catch (err) {
      console.error('Reorder failed:', err);
      await loadWatchlists();
    }
  }

  async function removeWatchlistItem(itemId) {
    const active = getActiveWatchlist();
    if (!active) return;
    try {
      await watchlistApi(`/watchlists/${active.id}/items/${itemId}`, 'DELETE');
      await loadWatchlists();
    } catch (err) {
      console.error('Delete item failed:', err);
      alert(`Could not delete symbol: ${err.message}`);
    }
  }
  // Exposed for any legacy inline handlers (now using addEventListener, kept for safety)
  window.removeWatchlistItem = removeWatchlistItem;

  async function moveActiveWatchlist(dir) {
    if (watchlists.length < 2) return;
    const idx = watchlists.findIndex(w => w.id === activeWatchlistId);
    if (idx < 0) return;
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= watchlists.length) return;
    const ordered = [...watchlists];
    const [moved] = ordered.splice(idx, 1);
    ordered.splice(newIdx, 0, moved);
    // Optimistic reorder
    watchlists = ordered;
    renderWatchlistSelector();
    try {
      await watchlistApi('/watchlists/order', 'PUT', { orderedIds: ordered.map(w => w.id) });
      await loadWatchlists();
    } catch (err) {
      console.error('Reorder watchlists failed:', err);
      await loadWatchlists();
    }
  }

  function setupWatchlistControls() {
    const select = document.getElementById('watchlist-select');
    const newBtn = document.getElementById('new-wl-btn');
    const upBtn = document.getElementById('move-wl-up-btn');
    const downBtn = document.getElementById('move-wl-down-btn');
    const renameBtn = document.getElementById('rename-wl-btn');
    const deleteBtn = document.getElementById('delete-wl-btn');

    if (select) {
      select.onchange = (e) => {
        activeWatchlistId = Number(e.target.value);
        saveActiveWatchlistId();
        renderActiveWatchlist();
      };
    }

    if (newBtn) {
      newBtn.onclick = async () => {
        const name = prompt("Enter new watchlist name:");
        if (name && name.trim()) {
          try {
            const created = await watchlistApi('/watchlists', 'POST', { name: name.trim() });
            activeWatchlistId = created.id;
            saveActiveWatchlistId();
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    if (upBtn) upBtn.onclick = () => moveActiveWatchlist(-1);
    if (downBtn) downBtn.onclick = () => moveActiveWatchlist(1);

    if (renameBtn) {
      renameBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const newName = prompt(`Rename watchlist "${active.name}" to:`, active.name);
        if (newName && newName.trim() && newName.trim() !== active.name) {
          try {
            await watchlistApi(`/watchlists/${active.id}`, 'PUT', { name: newName.trim() });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    if (deleteBtn) {
      deleteBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        if (watchlists.length <= 1) {
          alert("You must keep at least one watchlist.");
          return;
        }
        if (confirm(`Are you sure you want to delete the watchlist "${active.name}"?`)) {
          try {
            await watchlistApi(`/watchlists/${active.id}`, 'DELETE');
            activeWatchlistId = null;
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    const addSectionBtn = document.getElementById('add-section-btn');
    if (addSectionBtn) {
      addSectionBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const title = prompt("Enter section header name:", "### NEW SECTION");
        if (title) {
          try {
            await watchlistApi(`/watchlists/${active.id}/items`, 'POST', { type: 'section', title });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }

    const addTickerBtn = document.getElementById('add-ticker-btn');
    if (addTickerBtn) {
      addTickerBtn.onclick = async () => {
        const active = getActiveWatchlist();
        if (!active) return;
        const sym = prompt("Enter Yahoo ticker symbol (e.g., AAPL, PH, TVSMOTOR.NS, BTC-USD):");
        if (sym && sym.trim()) {
          try {
            await watchlistApi(`/watchlists/${active.id}/items`, 'POST', { type: 'ticker', symbol: sym.trim() });
            await loadWatchlists();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    initCharts();
    setupWatchlistControls();

    const symbolDisplay = document.getElementById('symbol-display');
    if (symbolDisplay) symbolDisplay.innerText = currentSymbol;

    loadData(currentSymbol, currentTimeframe);
    // Preload all 8 benchmark series (2 markets x 4 TFs) once, cache for RS pane.
    // Non-blocking: main chart + watchlists load first. Refresh RS when ready (first-paint race).
    preloadBenchmarks().then(() => { if (lastRaw.length && (!rsData.length || rsData.length !== lastRaw.length)) refreshRSPane(); });
    try {
      await loadWatchlists();
    } catch {
      renderWatchlistSelector();
      renderActiveWatchlist();
    }
  });
</script>
