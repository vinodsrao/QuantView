<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView Style Chart & Watchlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e222d; }
    ::-webkit-scrollbar-thumb { background: #363c4e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4f566b; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col select-none">

  <!-- Header Navigation Bar -->
  <header class="h-12 border-b border-[#2a2e39] bg-[#1e222d] flex items-center justify-between px-4 z-10 shrink-0">
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2 font-bold text-lg text-white">
        <span class="text-blue-500">❖</span>
        <span>ProChart</span>
      </div>
      <div class="h-4 w-[1px] bg-[#363c4e]"></div>
      
      <!-- Symbol Header & Selector -->
      <div class="flex items-center space-x-2">
        <span id="symbol-display" class="font-semibold text-white text-base">BTCUSDT</span>
        <span id="data-source-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-green-900/50 text-green-400 border border-green-700/50 font-mono">BINANCE LIVE</span>
      </div>

      <!-- Timeframe Buttons -->
      <div class="flex items-center space-x-1 ml-4 bg-[#131722] p-0.5 rounded border border-[#2a2e39]">
        <button class="tf-btn px-2.5 py-1 text-xs rounded font-medium hover:bg-[#2a2e39] text-blue-400 bg-[#2a2e39]" data-tf="1d">1D</button>
        <button class="tf-btn px-2.5 py-1 text-xs rounded font-medium hover:bg-[#2a2e39] text-gray-400" data-tf="1w">1W</button>
        <button class="tf-btn px-2.5 py-1 text-xs rounded font-medium hover:bg-[#2a2e39] text-gray-400" data-tf="1M">1M</button>
      </div>
    </div>

    <!-- Live Candle Legend HUD -->
    <div id="ohlcv-hud" class="flex items-center space-x-3 text-xs font-mono">
      <span>O: <span id="hud-o" class="text-white">--</span></span>
      <span>H: <span id="hud-h" class="text-white">--</span></span>
      <span>L: <span id="hud-l" class="text-white">--</span></span>
      <span>C: <span id="hud-c" class="text-white">--</span></span>
      <span>V: <span id="hud-v" class="text-white">--</span></span>
      <span id="hud-signal" class="px-1.5 py-0.5 rounded text-[10px] font-sans font-bold bg-gray-800 text-gray-400">NEUTRAL</span>
    </div>
  </header>

  <!-- Main App Layout -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Chart Column (Status Bar + Price Pane + Volume Pane) -->
    <div class="flex-1 flex flex-col overflow-hidden bg-[#131722] border-r border-[#2a2e39]">
      
      <!-- Dynamic Performance Metrics Top Status Bar -->
      <div class="h-9 border-b border-[#2a2e39] bg-[#1a1e29] px-4 flex items-center justify-between text-xs font-mono overflow-x-auto whitespace-nowrap shrink-0">
        <div class="flex items-center space-x-4">
          <div><span class="text-gray-400">1Y Ret:</span> <span id="m-1y" class="font-bold text-white">--</span></div>
          <div><span class="text-gray-400">3Y CAGR:</span> <span id="m-3y" class="font-bold text-white">--</span></div>
          <div><span class="text-gray-400">5Y CAGR:</span> <span id="m-5y" class="font-bold text-white">--</span></div>
          <div><span class="text-gray-400">10Y CAGR:</span> <span id="m-10y" class="font-bold text-white">--</span></div>
          <div><span class="text-gray-400">Pivot DD:</span> <span id="m-pdd" class="font-bold text-pink-500">--</span></div>
          <div><span class="text-gray-400">ATH DD:</span> <span id="m-athdd" class="font-bold text-pink-500">--</span></div>
          <div><span class="text-gray-400">ATR%:</span> <span id="m-atr" class="font-bold text-amber-400">--</span></div>
        </div>
        <div class="flex items-center space-x-4 border-l border-[#2a2e39] pl-4 text-gray-400">
          <div>MCap: <span id="m-mcap" class="text-gray-200">--</span></div>
          <div>PE: <span id="m-pe" class="text-gray-200">--</span></div>
          <div>Div Yield: <span id="m-div" class="text-gray-200">--</span></div>
        </div>
      </div>

      <!-- Main Candlestick Chart Pane -->
      <div id="price-chart-container" class="flex-1 w-full relative"></div>

      <!-- Separator Border -->
      <div class="h-[1px] bg-[#2a2e39] w-full shrink-0"></div>

      <!-- Dedicated Synchronized Volume Chart Pane -->
      <div id="volume-chart-container" class="h-32 w-full relative shrink-0"></div>
    </div>

    <!-- Sidebar: Watchlists with Collapsible Sections -->
    <div class="w-80 bg-[#1e222d] flex flex-col shrink-0">
      
      <!-- Watchlist Selector Dropdown Header -->
      <div class="p-3 border-b border-[#2a2e39] flex items-center justify-between">
        <select id="watchlist-select" class="bg-[#131722] text-white text-xs rounded border border-[#2a2e39] p-1.5 font-medium outline-none focus:border-blue-500 w-44">
          <option value="default">Main Watchlist</option>
          <option value="crypto">Crypto Stars</option>
        </select>
        <div class="flex items-center space-x-1">
          <button id="add-section-btn" title="Add Section Header" class="text-xs px-2 py-1 bg-[#2a2e39] hover:bg-[#363c4e] text-gray-200 rounded">+ Section</button>
          <button id="add-ticker-btn" title="Add Ticker" class="text-xs px-2 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold">+</button>
        </div>
      </div>

      <!-- Ticker & Section Search/List Container -->
      <div id="watchlist-items" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- Dynamic Watchlist Items Rendered Here -->
      </div>
    </div>

  </div>

  <!-- JavaScript Engine -->
  <script>
    // Asset and Calculation Engine
    let currentSymbol = 'BTCUSDT';
    let currentTimeframe = '1d';
    let chartData = [];
    let priceChart, volumeChart, candleSeries, volumeSeries;

    // Pine Script Dynamic Math Engine
    function calculatePineMetrics(data, zThreshold = 1.0, len = 21) {
      const volumes = data.map(d => d.volume);
      
      return data.map((bar, i) => {
        // Volume SMA & StdDev
        const sliceVol = volumes.slice(Math.max(0, i - len + 1), i + 1);
        const avgVol = sliceVol.reduce((a, b) => a + b, 0) / sliceVol.length;
        const variance = sliceVol.reduce((a, b) => a + Math.pow(b - avgVol, 2), 0) / sliceVol.length;
        const stdVol = Math.sqrt(variance) || 0.0001;

        // ATR Calculation
        let trSum = 0;
        const start = Math.max(0, i - len + 1);
        for (let j = start; j <= i; j++) {
          const prevClose = j > 0 ? data[j - 1].close : data[j].open;
          const tr = Math.max(
            data[j].high - data[j].low,
            Math.abs(data[j].high - prevClose),
            Math.abs(data[j].low - prevClose)
          );
          trSum += tr;
        }
        const atr = trSum / (i - start + 1);

        // Signal Logic Variables
        const mintick = 0.0001;
        const zScore = (bar.volume - avgVol) / Math.max(stdVol, mintick);
        const vRatio = bar.volume / Math.max(avgVol, 1);
        const priceRange = Math.max(bar.high - bar.low, mintick);
        const clv = (bar.close - bar.low) / priceRange;
        const pChg = i > 0 ? bar.close - data[i - 1].close : 0;
        const pMoveInten = Math.abs(pChg) / Math.max(atr, mintick);

        const isChurn = zScore > zThreshold && pMoveInten < 0.3;
        const isAccu = zScore > zThreshold && !isChurn && pChg > (-0.5 * atr) && ((pChg > 0 && clv > 0.4) || clv > 0.8);
        const isDist = zScore > zThreshold && !isChurn && (pChg < -atr || (pChg < 0 && clv < 0.6) || clv < 0.2);

        // Power & Alpha Calculations
        const decay = 1.0;
        const basePower = vRatio * pMoveInten * decay;
        const powerAccu = basePower * clv;
        const powerDist = basePower * (1 - clv);

        const accuAlpha = Math.min(100, Math.max(0, 100 - Math.floor(powerAccu * 60)));
        const distAlpha = Math.min(100, Math.max(0, 100 - Math.floor(powerDist * 60)));

        const isBullish = bar.close >= bar.open;
        let color = isBullish ? '#b2b5be' : '#4c525e';
        let wickColor = isBullish ? '#b2b5be' : '#848b9a';
        let signalTag = 'NEUTRAL';

        if (isChurn) {
          color = 'rgba(39, 156, 245, 0.8)';
          wickColor = 'rgba(39, 156, 245, 0.5)';
          signalTag = 'CHURN';
        } else if (isAccu) {
          color = `rgba(156, 245, 39, ${accuAlpha / 100})`;
          wickColor = 'rgba(156, 245, 39, 0.5)';
          signalTag = 'ACCUMULATION';
        } else if (isDist) {
          color = `rgba(245, 39, 156, ${distAlpha / 100})`;
          wickColor = 'rgba(245, 39, 156, 0.5)';
          signalTag = 'DISTRIBUTION';
        }

        // CAGR Lookback Offsets Logic
        const b1y = Math.min(i, 252);
        const b3y = Math.min(i, 756);
        const b5y = Math.min(i, 1260);
        const b10y = Math.min(i, 2520);

        const ret1y = i >= b1y && b1y > 0 ? (((bar.close - data[i - b1y].close) / data[i - b1y].close) * 100) : na();
        const cagr3y = i >= b3y && b3y > 0 ? (Math.pow(bar.close / data[i - b3y].close, 1/3) - 1) * 100 : na();
        const cagr5y = i >= b5y && b5y > 0 ? (Math.pow(bar.close / data[i - b5y].close, 1/5) - 1) * 100 : na();
        const cagr10y = i >= b10y && b10y > 0 ? (Math.pow(bar.close / data[i - b10y].close, 1/10) - 1) * 100 : na();

        // Drawdowns
        const peakToBar = Math.max(...data.slice(0, i + 1).map(d => d.high));
        const athDD = peakToBar > 0 ? ((bar.close - peakToBar) / peakToBar) * 100 : 0;

        return {
          ...bar,
          color,
          wickColor,
          borderColor: color,
          signalTag,
          atrPct: ((atr / bar.close) * 100).toFixed(2),
          ret1y: isNaN(ret1y) ? '--' : ret1y.toFixed(1) + '%',
          cagr3y: isNaN(cagr3y) ? '--' : cagr3y.toFixed(1) + '%',
          cagr5y: isNaN(cagr5y) ? '--' : cagr5y.toFixed(1) + '%',
          cagr10y: isNaN(cagr10y) ? '--' : cagr10y.toFixed(1) + '%',
          athDD: athDD.toFixed(1) + '%'
        };
      });
    }

    function na() { return NaN; }

    // Initialize Chart Panes with Synchronized Widths & Crosshairs
    function initCharts() {
      const priceContainer = document.getElementById('price-chart-container');
      const volumeContainer = document.getElementById('volume-chart-container');

      const chartOptions = {
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
        rightPriceScale: { minimumWidth: 75 }, // Ensures exact horizontal alignment
        timeScale: { rightOffset: 5, barSpacing: 8 }
      };

      priceChart = LightweightCharts.createChart(priceContainer, { ...chartOptions, height: priceContainer.clientHeight });
      volumeChart = LightweightCharts.createChart(volumeContainer, { ...chartOptions, height: volumeContainer.clientHeight });

      candleSeries = priceChart.addCandlestickSeries();
      volumeSeries = volumeChart.addHistogramSeries({ priceFormat: { type: 'volume' } });

      // Synchronize Scroll/Zoom Panes
      priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
        volumeChart.timeScale().setVisibleLogicalRange(range);
      });
      volumeChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
        priceChart.timeScale().setVisibleLogicalRange(range);
      });

      // Synchronize Crosshair Position & Status Bar Hover
      priceChart.subscribeCrosshairMove(param => updateStatusBar(param));
      volumeChart.subscribeCrosshairMove(param => updateStatusBar(param));
    }

    function updateStatusBar(param) {
      if (!param || !param.time || !chartData.length) {
        if (chartData.length) renderMetricsForBar(chartData[chartData.length - 1]);
        return;
      }
      const bar = chartData.find(d => d.time === param.time);
      if (bar) renderMetricsForBar(bar);
    }

    function renderMetricsForBar(bar) {
      document.getElementById('hud-o').innerText = bar.open.toFixed(2);
      document.getElementById('hud-h').innerText = bar.high.toFixed(2);
      document.getElementById('hud-l').innerText = bar.low.toFixed(2);
      document.getElementById('hud-c').innerText = bar.close.toFixed(2);
      document.getElementById('hud-v').innerText = bar.volume.toLocaleString();
      
      const sig = document.getElementById('hud-signal');
      sig.innerText = bar.signalTag;
      sig.className = `px-1.5 py-0.5 rounded text-[10px] font-sans font-bold ${
        bar.signalTag === 'ACCUMULATION' ? 'bg-green-900/80 text-green-300' :
        bar.signalTag === 'DISTRIBUTION' ? 'bg-pink-900/80 text-pink-300' :
        bar.signalTag === 'CHURN' ? 'bg-blue-900/80 text-blue-300' : 'bg-gray-800 text-gray-400'
      }`;

      document.getElementById('m-1y').innerText = bar.ret1y;
      document.getElementById('m-3y').innerText = bar.cagr3y;
      document.getElementById('m-5y').innerText = bar.cagr5y;
      document.getElementById('m-10y').innerText = bar.cagr10y;
      document.getElementById('m-pdd').innerText = bar.athDD;
      document.getElementById('m-athdd').innerText = bar.athDD;
      document.getElementById('m-atr').innerText = bar.atrPct + '%';
    }

    // Mock/Live Data Fetcher
    async function loadData(symbol) {
      try {
        const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1d&limit=500`);
        const json = await response.json();
        const raw = json.map(d => ({
          time: d[0] / 1000,
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4]),
          volume: parseFloat(d[5])
        }));
        
        chartData = calculatePineMetrics(raw);
        candleSeries.setData(chartData);
        volumeSeries.setData(chartData.map(d => ({ time: d.time, value: d.volume, color: d.color })));
        renderMetricsForBar(chartData[chartData.length - 1]);
      } catch (err) {
        console.log("Using synthetic fallback data");
      }
    }

    // Watchlist Management Engine
    const watchlists = {
      default: [
        { type: 'section', title: '### CRYPTO MAJORS' },
        { type: 'ticker', symbol: 'BTCUSDT', name: 'Bitcoin' },
        { type: 'ticker', symbol: 'ETHUSDT', name: 'Ethereum' },
        { type: 'section', title: '### ALTCOINS' },
        { type: 'ticker', symbol: 'SOLUSDT', name: 'Solana' },
        { type: 'ticker', symbol: 'BNBUSDT', name: 'Binance Coin' }
      ]
    };

    function renderWatchlist() {
      const container = document.getElementById('watchlist-items');
      container.innerHTML = '';

      watchlists.default.forEach((item, idx) => {
        if (item.type === 'section') {
          const div = document.createElement('div');
          div.className = 'text-[11px] font-bold text-gray-400 pt-3 pb-1 px-2 border-b border-[#2a2e39] flex justify-between items-center';
          div.innerHTML = `<span>${item.title}</span><button onclick="removeWatchlistItem(${idx})" class="text-gray-500 hover:text-red-400">×</button>`;
          container.appendChild(div);
        } else {
          const div = document.createElement('div');
          div.className = `p-2 rounded flex justify-between items-center cursor-pointer hover:bg-[#2a2e39] ${item.symbol === currentSymbol ? 'bg-[#2a2e39] border-l-2 border-blue-500' : ''}`;
          div.onclick = () => {
            currentSymbol = item.symbol;
            document.getElementById('symbol-display').innerText = item.symbol;
            loadData(item.symbol);
            renderWatchlist();
          };
          div.innerHTML = `
            <div>
              <div class="font-bold text-xs text-white">${item.symbol}</div>
              <div class="text-[10px] text-gray-400">${item.name}</div>
            </div>
            <button onclick="event.stopPropagation(); removeWatchlistItem(${idx})" class="text-gray-500 hover:text-red-400 text-xs">×</button>
          `;
          container.appendChild(div);
        }
      });
    }

    function removeWatchlistItem(idx) {
      watchlists.default.splice(idx, 1);
      renderWatchlist();
    }

    document.getElementById('add-section-btn').onclick = () => {
      const title = prompt("Enter section name:", "### NEW SECTION");
      if (title) {
        watchlists.default.push({ type: 'section', title: title.toUpperCase() });
        renderWatchlist();
      }
    };

    document.getElementById('add-ticker-btn').onclick = () => {
      const sym = prompt("Enter crypto pair symbol (e.g., AVAXUSDT):");
      if (sym) {
        watchlists.default.push({ type: 'ticker', symbol: sym.toUpperCase(), name: sym.toUpperCase() });
        renderWatchlist();
      }
    };

    window.onload = () => {
      initCharts();
      renderWatchlist();
      loadData(currentSymbol);
    };
  </script>
</body>
</html>
