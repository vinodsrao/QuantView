name = "stock-proxy"
main = "index.js"
compatibility_date = "2026-01-01"

# Serverless SQLite (D1) for watchlists.
# 1. Create once:  npx wrangler d1 create quantview-db
# 2. Copy the returned `database_id` below.
# 3. Apply schema: npx wrangler d1 migrations apply quantview-db --remote
[[d1_databases]]
binding = "DB"
database_name = "quantview-db"
database_id = "9947865d-cf61-470a-96b2-db9d46a2b13a"
migrations_dir = "migrations"